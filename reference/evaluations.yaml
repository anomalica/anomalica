schema: anomalica/evaluation-registry/2
state_schema: anomalica/evaluation-state/1
statuses:
  - proposed
  - ready-for-human-review
  - reviewed
  - adopted
  - rejected
  - blocked
gold_statuses:
  - unavailable
  - source-reviewed
  - provisional
  - ready-for-human-review
  - human-reviewed
  - reviewed-derived
evaluations:
  - id: audio-community1-exclusive
    title: Community-1 exclusive diarisation
    purpose: Compare regular and exclusive Community-1 diarisation tracks against reviewed speaker attribution.
    owner_repo: anomalica/ingester
    evidence:
      provider_id: audio-community1-exclusive-state
      detail_capability: audio-community1-exclusive-detail
    limits:
      rights: Source media and reviewed attribution remain controlled; publish aggregate results only.
      routes: Local Community-1 inference only; no hosted source-media route is authorised by this registry.
    artifacts:
      - id: audio-community1-exclusive-benchmark
        role: implementation
        visibility: public
        repository: anomalica/ingester
        path: formats/audio/workspace/benchmark_exclusive_diarisation.py
      - id: audio-community1-exclusive-evaluator
        role: implementation
        visibility: public
        repository: anomalica/ingester
        path: formats/audio/workspace/evaluate_exclusive_diarisation.py
      - id: audio-community1-exclusive-reviewed-attribution
        role: gold
        visibility: private
      - id: audio-community1-exclusive-result
        role: result
        visibility: private
      - id: audio-community1-exclusive-state
        role: state
        visibility: private
  - id: pdf-native-text-extraction
    title: Native PDF text extraction
    purpose: Measure local native text-layer extraction against page-anchored reviewed ingest text.
    owner_repo: anomalica/ingester
    evidence:
      provider_id: pdf-native-text-extraction-state
      detail_capability: pdf-native-text-extraction-detail
    limits:
      rights: The pilot source is public domain; reviewed source text is not reproduced in this registry.
      routes: Local deterministic extraction only; the pilot provides no evidence for raster optical character recognition.
    artifacts:
      - id: pdf-native-text-extraction-benchmark
        role: implementation
        visibility: public
        repository: anomalica/ingester
        path: formats/pdf/workspace/benchmark_native_extraction.py
      - id: pdf-native-text-extraction-reviewed-reference
        role: gold
        visibility: private
      - id: pdf-native-text-extraction-result
        role: result
        visibility: private
      - id: pdf-native-text-extraction-state
        role: state
        visibility: private
  - id: search-reranker-minilm-vs-granite
    title: MiniLM versus Granite search reranking
    purpose: Compare reranking quality and local resource use on identical frozen claim candidate pools.
    owner_repo: anomalica/assimilator
    evidence:
      provider_id: search-reranker-minilm-vs-granite-state
      detail_capability: search-reranker-human-judgements
    limits:
      rights: The fixture contains project-authored claims rather than source excerpts and is declared CC0-1.0.
      routes: Local pinned-model inference only; results do not measure first-stage retrieval or corpus-wide recall.
    artifacts:
      - id: search-reranker-minilm-vs-granite-report
        role: report
        visibility: public
        repository: anomalica/assimilator
        path: workspace/reports/search-reranker-benchmark-2026-09-13/README.md
      - id: search-reranker-minilm-vs-granite-fixture
        role: fixture
        visibility: public
        repository: anomalica/assimilator
        path: workspace/reports/search-reranker-benchmark-2026-09-13/fixture.json
      - id: search-reranker-minilm-vs-granite-result
        role: result
        visibility: public
        repository: anomalica/assimilator
        path: workspace/reports/search-reranker-benchmark-2026-09-13/controlled-run-2026-09-14/controlled-comparison-cuda.json
      - id: search-reranker-minilm-vs-granite-human-judgements
        role: gold
        visibility: private
      - id: search-reranker-minilm-vs-granite-state
        role: state
        visibility: public
        repository: anomalica/assimilator
        path: workspace/reports/search-reranker-benchmark-2026-09-13/evaluation-state.json
  - id: digest-evaluation-corpus
    title: Digest extraction evaluation corpus
    purpose: Maintain a rights-aware reviewed-source corpus for deterministic extraction evaluation and controlled model comparison.
    owner_repo: anomalica/digester
    evidence:
      provider_id: digest-evaluation-corpus-state
      detail_capability: digest-evaluation-corpus-detail
    limits:
      rights: Current selected records are public domain; source bodies and reviewer identities remain outside this public
        registry.
      routes: Deterministic grading requires authenticated gold; hosted inference also requires the corpus manifest's route-specific
        admission checks.
    artifacts:
      - id: digest-evaluation-corpus-manifest
        role: manifest
        visibility: public
        repository: anomalica/digester
        path: workspace/benchmarks/evaluation-corpus.yaml
      - id: digest-evaluation-corpus-validator
        role: implementation
        visibility: public
        repository: anomalica/digester
        path: workspace/benchmarks/evaluation_corpus.py
      - id: digest-evaluation-corpus-human-gold
        role: gold
        visibility: private
      - id: digest-evaluation-corpus-state
        role: state
        visibility: private
  - id: account-chronology
    title: Account chronology extraction
    purpose: Evaluate narrative-account boundaries, exact claim assignment and within-account chronology without canonical
      activation.
    owner_repo: anomalica/digester
    evidence:
      provider_id: account-chronology-state
      detail_capability: account-chronology-review
    limits:
      rights: The source is controlled publicly accessible material; source text, claim quotes and reviewer identity remain
        private.
      routes: Local report-only evaluation; no scoreable prediction route or canonical activation is authorised.
    artifacts:
      - id: account-chronology-manifest
        role: manifest
        visibility: public
        repository: anomalica/digester
        path: workspace/benchmarks/account-chronology-evaluation.yaml
      - id: account-chronology-evaluator
        role: implementation
        visibility: public
        repository: anomalica/digester
        path: workspace/benchmarks/account_chronology_eval.py
      - id: account-chronology-review-interface
        role: review-interface
        visibility: public
        repository: anomalica/workbench
        path: src/lib/components/AccountChronologyView.svelte
      - id: account-chronology-gold
        role: gold
        visibility: private
      - id: account-chronology-state
        role: state
        visibility: private
