      - {name: asset_text_sha256, type: string, required: true, description: "Full SHA-256 of the exact UTF-8 canonical extracted
          text for this Asset page. Different frames are not comparable without deterministic remapping."}
      - {name: asset_span, type: object, required: true, description: "`{start, end}` half-open Unicode code-point interval
          in the canonical extracted text of exactly this Asset page; integer 0 <= start < end."}
      - {name: body_span, type: object, required: true, description: "`{start, end}` half-open Unicode code-point interval
          in the exact materialised pre-digest bound by pre_digest.sha256; integer 0 <= start < end."}
      - {name: quote, type: string, required: true, description: "Exact non-empty pre-digest substring at body_span for this
          fragment."}
    invariants:
      - "One anchor cannot cross a page or Asset boundary. Every anchor is contained by the Record Selection and agrees with
        page_map, asset_text_sha256 and the prep-version-9 source map."
      - "A claim's anchors are non-empty and ordered by ascending record_page, then asset-local start and end. Elided fragments
        remain separate; an enclosing interval is forbidden."
  source_anchor_identity:
