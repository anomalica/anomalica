      - {name: viewed_ref, type: string, required: true, description: "Exact commit SHA returned by the view."}
      - {name: viewed_content_hash, type: string, required: true, description: "Exact full record content hash returned by
          the view."}
      - {name: viewed_input_sha256, type: string, required: true, description: "Exact complete-file hash returned by the view."}
      - {name: viewed_result_sha256, type: string, required: true, description: "Exact sidecar result hash returned by the
          view."}
      - {name: viewed_algorithm_version, type: string, required: true, description: "Exact manifest version returned by the
