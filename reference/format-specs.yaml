    fixture:
      json: '{"schema":"anomalica/evidence-unit-identity/1","asset_hash":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","asset_file_page":4,"asset_text_sha256":"sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","span":{"start":340,"end":600}}'
      id: sha256:1231cb20ca71c866623a2fc4ede53cef5b74fc59548e57b7d845dd09c0d0ab60
  digest_record_snapshot_identity:
    schema: anomalica/digest-record-snapshot/1
    status: stable
    serialisation: compact canonical UTF-8 JSON under a fixed domain prefix
