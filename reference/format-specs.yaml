      - "Canonicalise under RFC 8785 JSON Canonicalization Scheme (I-JSON input, recursively sorted keys, significant array
        order, deterministic string escaping, UTF-8 and no whitespace/newline). Hash the 35 ASCII bytes `anomalica-digest-record-snapshot-v1`,
        one zero byte, then those bytes; prefix the lowercase SHA-256 with `sha256:`."
    fixture:
