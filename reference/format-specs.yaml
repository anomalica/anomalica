  pre_digest_source_map:
    schema: anomalica/pre-digest-source-map/1
    status: stable
    serialisation: compact content-addressed UTF-8 JSON in the ingests repository at source-maps/{bare_source_map_sha256}.json
    spec_doc: architecture/digest-format.md
    owner: shared-pre-digest-producer
    summary: Deterministic mapping from claim-eligible prep-version-9 body intervals to one selected Asset page's canonical
      extracted text; carried through every pre-digest transform.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/pre-digest-source-map/1`."}
      - {name: record_hash, type: string, required: true, description: "Full stable Record content_hash."}
      - {name: body_sha256, type: string, required: true, description: "Exact materialised pre-digest SHA-256 also carried
          as digest.pre_digest.sha256."}
      - {name: entries, type: list, required: true, description: "Source-ordered non-overlapping entries `{body_span, asset_hash,
          record_page, asset_file_page, asset_text_sha256, asset_span}`. Both spans are integer half-open Unicode code-point
          intervals. asset_text_sha256 is the full SHA-256 of the exact UTF-8 canonical extracted text for that Asset page.
          One entry cannot cross an Asset or page boundary."}
    invariants:
      - "Every claim-eligible retained body code point has deterministic source coverage. Synthetic context may be explicitly
        non-claimable; a claim touching it or any unmapped/ambiguous interval is invalid."
      - "Whitespace collapse, annotation removal, irrelevant-region removal and timestamp stripping preserve or update this
        map deterministically. Entries are maximal: coalesce adjacent entries whenever Asset/page/text-frame identity matches
        and both body and Asset spans meet exactly at their boundaries. Serialise top-level keys in order schema, record_hash,
        body_sha256, entries; entry keys in the order stated above; each span uses start, end. Use compact JSON with no whitespace/newline
        and UTF-8 with non-ASCII unescaped. Escape quotation mark and reverse solidus with a reverse solidus, use `\\b`, `\\f`,
        `\\n`, `\\r`, `\\t` for those controls and lowercase `\\u00xx` for every other U+0000-U+001F control; never escape
        solidus. pre_digest.source_map_sha256 is SHA-256 of exactly those bytes and resolves the content-addressed path."
    fixture:
      json: '{"schema":"anomalica/pre-digest-source-map/1","record_hash":"sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","body_sha256":"sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd","entries":[{"body_span":{"start":0,"end":3},"asset_hash":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","record_page":1,"asset_file_page":4,"asset_text_sha256":"sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","asset_span":{"start":10,"end":13}}]}'
      sha256: sha256:ad34f3ff5e814321cc0c48a733fd96e260bf04a9a2a572ecf263f0da33d282d9
  claim_source_anchor:
    schema: anomalica/claim-source-anchor/1
    status: stable
    serialisation: embedded YAML object in anomalica/digest/2
    spec_doc: architecture/digest-format.md
    summary: One exact quote fragment mapped from the materialised pre-digest to one selected Asset page.
    fields:
      - {name: asset_hash, type: string, required: true, description: "Selected Asset's full SHA-256."}
      - {name: record_page, type: integer, required: true, description: "Positive 1-based Record-local page ordinal."}
      - {name: asset_file_page, type: integer, required: true, description: "Positive 1-based physical PDF page ordinal, or
