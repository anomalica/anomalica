        Elizondo"],"published_date":"2024"},"schema":"anomalica/digest-record-snapshot/1","selection":[{"asset_hash":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","selector":{"page":4,"type":"pdf_page"}}],"title":"Imminent:
        Inside the Pentagon''s Hunt for UFOs"}'
      id: sha256:375ead75c85f48ad5f19f2c3ab797b3cbb7099651dd23eb752ebc5cdec021b47
  digest:
    schema: union of anomalica/digest/1 and anomalica/digest/2
    status: stable
    serialisation: YAML
    spec_doc: architecture/digest-format.md
    variants: [digest_v1, per_model_digest]
    summary: Canonical digest union. Non-paged audio/video/web/ebook Records use digest/1; eligible page-mapped PDF/image
      Records use digest/2. Consumers dispatch by exact schema and reject unsupported schema/media combinations.
  digest_v1:
    schema: anomalica/digest/1
    status: stable
    serialisation: YAML
    spec_doc: architecture/digest-format.md
    summary: Current digest wire format for audio, video, web and ebook Records pending typed Asset coordinates; also the
      legacy-readable format for older PDF/image digests. It cannot drive evidence identity, independence counts or generated
      public Record claims.
    fields:
      - {name: run_kind, type: string, required: new-output, description: "production or comparison, under the same canonical-path
          rules as digest/2."}
      - {name: schema, type: string, required: true, description: "`anomalica/digest/1`."}
      - {name: extracted_at, type: string, required: true, description: "ISO 8601 extraction timestamp."}
      - {name: model, type: string, required: true, description: "Resolved model id."}
      - {name: extraction_generation, type: integer, required: new-output, description: "Positive digest-fidelity generation."}
      - {name: extraction_config, type: string, required: new-output, description: "Full exact extraction-configuration SHA-256."}
      - {name: ai_usage, type: list, required: false, description: "Same closed provenance-only usage shape as digest/2."}
      - {name: review_state, type: object, required: false, description: "Extraction-time provenance only; never current review
          authority."}
      - {name: prompts, type: list, required: false, description: "Same prompt-provenance shape as digest/2."}
      - {name: pre_digest, type: object, required: new-output, description: "Exactly `{sha256, prep_version}` for current
          non-paged output. Existing pre-stamping digest/1 files may omit it and are freshness-unknown. source_map_sha256
          is forbidden because this schema has no typed Asset coordinate contract."}
      - {name: record_snapshot_sha256, type: string, required: new-output, description: "Full anomalica/digest-record-snapshot/1
          identity projected directly from the live record/3. A mismatch is stale even when stable content_hash is unchanged."}
      - {name: curation, type: list, required: false, description: "Same ordered explicit digest-curation provenance entries
          as digest/2."}
      - {name: record, type: object, required: true, description: "For new record/3 output: the complete structural snapshot
          `{id, content_hash, title, producer?, date?, reference?, assets, asset_rights, selection, work_provenance?}`. assets
          is the first-use ordered public structural projection `{asset_hash, source_type, file_format, pages?, derived_from?}`;
          derived_from is `{asset_hash, transform}`. Existing digest/1 files retain their legacy Record shape and are structural/freshness-unknown
          until regenerated."}
      - {name: terminology, type: object, required: false, description: "Same optional terminology shape as digest/2."}
    body:
      nodes: "Same node shape as digest/2."
      domain_claims: "Same semantic claim fields as digest/2 except source_anchors is forbidden, quote is required and non-empty,
        and scalar location is optional display text only. Claims cannot contribute anchor-based evidence independence or
        generated public Record sections."
      infrastructure_claims: "Same shape as domain_claims, routed to the infrastructure graph; omitted when empty."
  per_model_digest:
    schema: anomalica/digest/2
    status: stable
    serialisation: YAML
    spec_doc: architecture/digest-format.md
    summary: >-
      One model's extraction of a page-mapped PDF/image Record: a full set of nodes and exactly anchored claims. The current
      pipeline produces one canonical digest; the provisional selector may later compare several candidates.
    fields:  # top-level metadata ("header"); the body is nodes + claims (see body)
      - {name: run_kind, type: string, required: new-output, description: "`production` or `comparison`. Only production and
          legacy digests with this field absent can be canonical graph inputs. Comparison is inert regardless of path; paths
          below variants/ and hidden paths are non-canonical regardless of this value. Visible nested paths remain supported
          for legacy titles containing `/`. Discovery, explicit import and rebuild use the same predicate."}
      - {name: schema, type: string, required: true, description: "`anomalica/digest/2`, currently valid only for page-mapped
          PDF/image record/3 input. Digest/1 remains the output for other media and is legacy-readable, but its scalar location
          is non-authoritative and cannot drive evidence operations or generated public claims."}
      - {name: extracted_at, type: string, required: true, description: "ISO 8601 timestamp of the extraction run."}
      - {name: model, type: string, required: true, description: "The model that produced this digest (digest/2 carries the
          versioned id)."}
      - {name: extraction_generation, type: integer, required: new-output, description: "Positive manually maintained digest-fidelity
          cohort, compared with digest-generation.json. Equal is current; lower is stale; absent, malformed or greater is
          unknown. Stale and unknown are both ineligible for current-only operations. Never inferred or back-stamped."}
      - {name: extraction_config, type: string, required: new-output, description: "Full `sha256:<64 lowercase hex>` fingerprint
          of the complete effective extraction configuration under deterministic canonical JSON: resolved model/version, ordered
          passes and prompt hashes, preparation version, chunking, decoding, validation and deterministic post-processing.
          Any exact setup change changes this fingerprint; it does not itself bump extraction_generation."}
      - {name: ai_usage, type: list, required: false, status: provisional, description: "Per-stage AI-processing provenance
          carried forward onto this digest (model, token counts). Data kept, not publicly surfaced."}
      - {name: review_state, type: object, required: false, description: "The source record's review state AT EXTRACTION TIME
          - provenance, like prompts/pre_digest/ai_usage. {reviewed (bool), coverage (fraction of sections observed), checked_at}.
          NEVER resolve current review state from this: the ingest's review sidecar is the single source of truth and gating
          consumers read it at import/rebuild, so a review takes effect without re-digestion. ABSENT means NOT RECORDED, never
          unreviewed - three distinguishable states. coverage is a fraction because review is per-section (0046)."}
      - {name: prompts, type: list, required: false, description: "Which prompt produced each pass, so the digest is attributable
          to an exact prompt (mirrors 0010-auditable-assembly). One entry per pass: {pass, id, version, sha256, file}. An
          override is recorded as version 'override' with the file's own hash. Absent on pre-stamping digests."}
      - {name: pre_digest, type: object, required: true, description: "Content hash of the pre-digest - the ingest after deterministic
          model-prep (irrelevant removed, footnotes inlined, timestamps stripped), the exact model input (0042). Exactly {sha256,
          prep_version, source_map_sha256}; prep_version 9 is the first source-map contract. Together with extraction_config,
          binds exact input, source mapping and setup."}
      - {name: record_snapshot_sha256, type: string, required: true, description: "Full anomalica/digest-record-snapshot/1
          identity projected directly from the live record/3. A mismatch is stale even when stable content_hash is unchanged."}
      - {name: curation, type: list, required: false, description: "Ordered explicit digest-curation provenance entries defined
          by digest-format.md; absent means unmodified model output."}
      - {name: record, type: object, required: true, description: "Complete source Record snapshot: `{id, content_hash, title,
          producer?, date?, reference?, assets, asset_rights, selection, page_map, work_provenance?}`. assets is the first-use
          ordered public structural projection `{asset_hash, source_type, file_format, pages?, derived_from?}`; derived_from
          is `{asset_hash, transform}`. asset_rights is the complete ordered `{asset_hash, status}` list; selection and page_map
          are complete; work_provenance is copied unchanged. The assimilator recomputes Record identity, Asset lineage and
          anchors from this snapshot. Rights remain non-authoritative."}
      - {name: terminology, type: object, required: false, description: "Optional terminology block defined by digest-format.md."}
    body:
      nodes: "List of every node mentioned by any claim. Each: {id (UUID, fresh per digest), type (one of person, organisation,
        project, place, event, object, document, topic), name, metadata?}."
      domain_claims: "Claims routed to the knowledge graph. Each: {id, type (observation|testimony|hearsay|opinion|measurement|administrative),
        attestation (first_hand|second_hand|third_hand), speaker?, provenance_chain, source_anchors (non-empty ordered claim-source-anchor/1
        list), date? | date_range?, refs?, quote? (derived display join of anchor fragments), text}. Deterministic realignment
        failure rejects the claim; no rough model location is retained. Equal proposition/provenance may union unique anchors
        in canonical order rather than emit duplicates."
      infrastructure_claims: "Same shape as domain_claims, routed to the infrastructure graph. Omitted when empty."
    forbidden_until_evaluated:
      accounts: "Narrative accounts are report-only until scored against the Doty ground truth for precision, recall and boundary
        overlap, then reviewed as adequate. Activation requires an extraction-generation bump."
      claim_to_account: "Canonical claims must not carry account/account_id/account_ids until claim-binding coverage is evaluated
        and account fields are activated in this contract."
  digest_generation:
    schema: anomalica/digest-generation/1
    status: stable
    serialisation: JSON
    spec_doc: architecture/digest-format.md
    path: digest-generation.json
    owner: digester
    summary: Repository-root declaration of the manually maintained current digest extraction generation. Consumers read it
      from the same committed tree as the digest corpus; missing, malformed or unsupported state fails closed for current-only
      operations. JSON prevents collision with recursive YAML digest discovery.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/digest-generation/1`."}
      - {name: current_generation, type: integer, required: true, description: "Positive current extraction generation. A
          digest equals it to be generation-current; lower is stale; absent/malformed/greater is unknown. Unknown is reported
          separately but treated as not current."}
  freshness_manifest:
    schema: anomalica-freshness/v1
    status: stable
    serialisation: JSON
    spec_doc: architecture/freshness.md
    owner: assimilator
    summary: Flattened, deduplicated freshness reason groups derived from one exact schedule and consumed by deployment only
      under an explicit exact-byte SHA-256 guard.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica-freshness/v1`."}
      - {name: generated_at, type: string, required: true, description: "Non-empty generation time copied from the source
          schedule."}
      - {name: source_queue_sha256, type: string, required: true, description: "Exactly 64 lowercase hexadecimal digits: SHA-256
          of the complete exact schedule JSON bytes used to derive this manifest."}
      - {name: groups, type: list, required: true, description: "Canonical reason groups sorted by `(boundary, artifact)`.
          Local and inherited queue groups are flattened and deduplicated; every manifest group therefore carries `inherited:
          []`. Group shape and boundary-specific reason vocabularies are defined in freshness.md."}
    identities:
      record: "Full `sha256:<record-content-hash>` at record-generation and digest-input."
      digest: "Canonical repository-relative digest YAML path at digest-generation."
      graph: "Full `sha256:<record-content-hash>` bound by the graph import receipt."
      brief: "`<section>/<slug>` with no extension."
      article: "`<section>/<slug>.<language>` with no `.md` extension."
      deployment: "Exact built or public path; `production-build` identifies a build failure before a path exists."
    invariants:
      - "The writer verifies that the exact source schedule bytes equal the in-memory schedule before hashing and emitting
        the manifest."
      - "Deployment requires manifest path and expected manifest SHA-256 together, verifies the exact bytes before parsing,
        and fails closed on hash, schema, required-field, boundary or reason-placement errors."
      - "`payload_hash_mismatch` is valid only at brief-selection and article-input."
      - "The manifest reports and carries scheduling state; it grants no model-dispatch authorisation."
  selected_digest:
    schema: anomalica/digest/1 or anomalica/digest/2, matching the selected candidate
    status: provisional
    serialisation: YAML
    spec_doc: decisions/0039-multi-model-digestion-canonical-reconciliation.md
    summary: Planned selector output, not the current canonical path. The digest selector would pick the single best per-model
      digest whole; it would not merge them. Today the digester writes the one canonical digest directly.
    fields:
      - {name: schema, type: string, required: true, description: "Unchanged winning candidate schema: anomalica/digest/1
          for non-paged media or anomalica/digest/2 for eligible page-mapped PDF/image input."}
      - {name: selected_at, type: string, required: true, description: "ISO 8601 timestamp of the selection run."}
      - {name: selected_from, type: list, required: true, description: "The per-model digests the selection chose among -
          each {model, version} (+ its source path/hash), the winner marked. The digest-level audit: which models' extractions
          were candidates and which was picked."}
      - {name: extraction_generation, type: integer, required: true, description: "Winning per-model digest's manually maintained
          extraction generation, copied unchanged so selection preserves freshness identity."}
      - {name: extraction_config, type: string, required: true, description: "Winning per-model digest's exact configuration
          fingerprint, copied unchanged so selection preserves run identity."}
      - {name: record, type: object, required: true, description: "The source record - same shape and same value as the per-model
          digests' (one source). The source-trace rides on this being constant across the per-model digests and the selected
          one."}
    body:
      nodes: "The winning per-model digest's nodes, unchanged - selection picks a whole digest, so nodes are never merged
        across models."
      domain_claims: "The winning per-model digest's claims, unchanged. Digest 2 preserves source_anchors; digest 1 preserves
        its legacy scalar display location. No cross-model merge: models on one Record are alternatives, not corroboration,
        and the selector picks one whole digest rather than collapsing claims (0039 independence rule)."
      infrastructure_claims: "Same shape, routed to the infrastructure graph."
  brief:
    schema: anomalica/brief/2
    status: stable
    serialisation: YAML
    spec_doc: architecture/brief-format.md
    summary: The graph slice feeding ONE page - language-neutral, pre-prose; the writer's sole input (decision 0036).
    # A page covers one or more nodes: `page.nodes` is the covered set (brief/2, 2026-09-03).
    fields:  # top-level; the body is the ordered `claims` selection (see body)
      - {name: schema, type: string, required: true, description: "`anomalica/brief/2`."}
      - {name: brief_hash, type: string, required: true, description: "SHA-256 of UTF-8 compact JSON with keys in order {kind,
          node_id, claims}, no spaces/newline and non-ASCII unescaped: kind is page.kind; legacy-named node_id is ordered
          page.nodes[].node_id joined by comma; claims is ordered [[claim_id, claim_hash], ...]. Exact fixture and exclusions
          are in brief-format.md. Stable identity for semantic selection and covered page members."}
      - {name: payload_hash, type: string, required: true, description: "SHA-256 of UTF-8 compact canonical JSON with recursively
          sorted object keys, no spaces/newline and non-ASCII unescaped, over exactly {page: {kind, title, slug, node_type,
          nodes}, claims, related_nodes}. List order is significant. Exact writer-visible payload identity; copied with brief_hash
          into article built_from and compared independently for freshness."}
      - {name: page, type: object, required: true, description: "The page this brief builds: {kind: entity, node_type, title,
          slug, nodes: [{node_id, name, node_type}]}. `nodes` is the covered set - always a list, one entry for an ordinary
          page, several for a composed page; there is no page-level node_id, and a consumer acting on a covered node acts
          on EVERY member. node_type/slug/title are the page's own identity, not a member's. slug pre-resolved by the synthesiser.
          Person pages may additionally carry listing {work_count, subject_claim_count, claim_count}: a complete tuple of
          separate non-negative raw page-gate measurements consumed directly by the site, never copied through content or
          collapsed into one weighted score. New publishable person briefs emit it; readers tolerate its absence."}
      - {name: generated, type: object, required: true, description: "{graph_version} - the knowledge-graph version the brief
          was generated from (0010's coarse stamp)."}
      - {name: related_nodes, type: list, required: false, description: "Nodes co-occurring with the page entity, ranked by
          shared-claim count; each carries its resolved slug for cross-links."}
    body:
      claims: "Ordered selection - the only facts the writer may use. Each: {claim_id, claim_hash, content, original_excerpt,
        claim_type, attestation?, speaker {node_id,title}, node_refs, date, date_end, source_anchors, evidence {score, evidence_unit_ids,
        provenance_root_ids, independence_status, independent_sources}, provenance {record_id, record_title, record_date,
        record_reference, content_hash, friendly_name}}. For eligible digest/2 claims source_anchors is non-empty and evidence_unit_ids
        contains the sorted full derived ids. Digest/1 claims omit source_anchors, use an empty evidence_unit_ids list and
        set independence_status unknown. Missing derivation fails closed; a scalar count alone is insufficient."
  content:
    schema: null  # no schema identifier defined yet
    status: provisional
    serialisation: markdown + YAML frontmatter
    spec_doc: architecture/content-format.md
    summary: The assembler's output - one rendered article per language, consumed by the Hugo site. Layout remains unsettled;
      audit fields are settled in content-format.md.
    warning: >-
      Content's layout (flat `<slug>.<lang>.md` vs document-first directories) is an unratified decision (assembler.md flags
      its own layout section as out of date). This provisional status concerns layout, not the settled machine-owned `built_from`
      and `built_by` audit fields.
    fields:  # human-authored keys are preserved; built_from and built_by are machine-owned
      - {name: title, type: string, required: true, description: "Article/page title."}
      - {name: description, type: string, required: false, description: "Short description."}
      - {name: directives, type: list, required: false, description: "Article-level presentational instructions to the assembler
          (style/formatting/naming only - never factual). Also sourced from `_directives.yaml` folder hierarchy and per-article
          `<slug>.directives.yaml` sidecars."}
      - {name: metadata, type: object, required: false, description: "Optional metadata the assembler reads but does not modify.
          Sub-shape not yet specified."}
      - {name: record_hash, type: string, required: record-page, description: "First 56 lowercase hexadecimal characters of
          the live Record's content_hash. Stable public locator for both shell and reviewed page; never an Asset possession
          hash."}
      - {name: source, type: object, required: eligible-record-page, description: "Fail-closed public projection from current
          ingest authority. Contains safe source metadata and independent source_body, archived_original, media, provider_embed
          and external_link capabilities. Never full hashes, review/verification data, private or fetched paths, signed URLs,
          raw frontmatter, processing metadata, word timestamps or disallowed source bytes."}
      - {name: references, type: list, required: generated-page, description: "Attributed source references and supporting
          quotations. Record-page reviewer deep-links and facts/entities inspection remain in the Workbench."}
      - {name: built_from, type: object, required: entity-brief-page, description: "Machine-owned entity input binding, exactly
          {brief_hash, payload_hash, claims: [{id, hash}] in brief order, claims_available?, claims_used?}. The two hashes
          bind stable semantic selection and exact writer-visible payload separately. The two counts are present together
          only when selection was capped. The article's <section>/<slug> path locates the brief. Public record pages use their
          separate record_hash contract; transitional node-mode pages lack built_from until rebuilt from briefs."}
      - {name: built_by, type: object, required: generated-page, description: "Machine-owned generator and output identity.
          Carries route-qualified model id and model_version; transport; logical prompt, system-prompt, resolved-directive,
          submitted-payload and body SHA-256 values; system-prompt role; transport implementation/version/configuration hash;
          scaffold exposure; and temporary assembly token usage. OpenAI-subscription execution fields follow content-format.md's
          conditional requirements."}
    open_questions:
      - "Layout: flat `<slug>.<lang>.md` (assembler.md) vs document-first `index.{lang}.md` directories (content-lifecycle.md)
        - unratified."
    sidecars:
      review.yaml: "Append-only human-review log. Each entry: {date, language, reviewer, body_hash (sha256 of the markdown
        body), comment}. Informational, never a publication gate."
      verification.yaml: "AI verification report (a different model checks every assertion traces to the graph). Informational,
        never a gate."
  public_record_page:
    schema: anomalica/public-record/2
    status: stable
    serialisation: markdown + YAML frontmatter and permitted public resources
    spec_doc: architecture/content-format.md
    section: records
    summary: Stable reader-facing hash route for every live Record. Before complete current review and page-mapped digest-2
      eligibility it is a safe metadata-only noindex shell; eligible PDF/image Records become indexed generated explanation
      and claims pages at the same route. Other media remain shells in this contract. Source bodies, originals, media, embeds
      and links are admitted independently per Asset.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/public-record/2`."}
      - {name: content_kind, type: string, required: true, description: "Literal `record`. The name avoids Hugo's reserved
          frontmatter `kind` field."}
      - {name: title, type: string, required: true, description: "Safe bibliographic record title."}
      - {name: description, type: string, required: eligible-generated-only, description: "Generated public summary, never
          the ingest's source-authored blurb. Omitted whenever the complete review/digest/anchor eligibility predicate fails."}
      - {name: record_hash, type: string, required: true, description: "First 56 lowercase hexadecimal characters of the Record
          content_hash. This is a direct stable Record locator, never an Asset hash."}
      - {name: noindex, type: boolean, required: ineligible-shell-only, description: "Literal true whenever the complete review/digest/anchor
          eligibility predicate fails; forbidden only on an eligible generated page."}
      - {name: metadata, type: object, required: true, description: "Allow-listed source_types, document_type, publisher,
          creators, publication date, duration and page count; absent values omitted."}
      - {name: source, type: object, required: eligible-generated-only, description: "Exactly `{assets: [...]}` in first-selection-use
          order. Each member is exactly `{ordinal, source_type, file_format, pages?, selected_record_pages, capabilities}`;
          ordinal is 1-based, selected_record_pages is an ordered positive-integer list, and capabilities has exactly source_body,
          archived_original, media, provider_embed and external_link. Every capability is `{mode, reason}` plus only its permitted
          payload from content-format.md. Full Asset hashes are forbidden. Permission or possession of one member never unlocks
          another; composite body access requires authority for every contributing member. Missing, unknown or inconsistent
          state denies."}
      - {name: references, type: list, required: eligible-generated-only, description: "Attributed claims with stable Record
          route plus `#source-{source_anchor_id}` evidence-site anchors and citation-sized supporting quotations. The id follows
          decision 0051's exact domain-separated codec; a truncated-id collision fails the page build."}
      - {name: built_by, type: object, required: eligible-generated-only, description: "Machine-owned generator identity defined
          by content format."}
    forbidden:
      - kind (reserved Hugo frontmatter field; use content_kind)
      - full content_hash or source_hash
      - review entries, reviewer identity, notes or spans
      - verification challenge data
      - private/fetched paths or signed object URLs
      - raw ingest frontmatter, processing metadata or word timestamps
      - facts/entities inspection and reviewer deep-links
# The hash / identity chain, source -> published article. Follows one fact end to end.
chain:
  - stage: source asset
    detail: "Immutable acquired bytes or explicitly linked retained derivatives, identified by full byte SHA-256 and archived
      as records/{asset_hash}.{ext}."
  - stage: ordered selection and Record
    detail: >-
      A non-empty ordered list of whole-Asset or atomic physical-PDF-page selectors defines the Record. content_hash is the
      anomalica/record-identity/1 domain-separated hash of only the expanded ordered Asset hashes and selectors. No title,
      URL, rights or generated text enters identity; a composite has no synthetic original.
  - stage: ingest
    detail: >-
      store/{content_hash}.md is the current implementation envelope: authoritative Record frontmatter plus current generated
      Ingest body. Exact body/Git/pre-digest hashes bind revisions. Re-extraction preserves Record identity but invalidates
      derived exact-input bindings as applicable.
  - stage: digest
    detail: >-
      One canonical digest per Record at digests/{friendly-name}.yaml. record.content_hash is the stable Record binding. Page-mapped
      PDF/image Records use schema 2, whose claims carry exact ordered Asset/page anchors through a prep-version-9 source
      map; other media remain schema 1 and ineligible for anchor operations. Freshness also binds the current materialised
      pre-digest SHA-256 and extraction generation.
  - stage: graph import
    detail: >-
      Derived import receipt keyed by record content hash carries canonical digest path, SHA-256 of the exact digest YAML
      bytes and deterministic import generation. Presence of a record alone does not prove its current digest was imported.
  - stage: brief
    detail: >-
      Per page. Each selected claim carries stable Record provenance and evidenced provenance roots. Eligible digest/2 claims
      also carry source anchors and evidence-unit ids; digest/1 claims remain overlap-unknown. A scalar independent-source
      count without its derivation is insufficient. brief_hash fingerprints the ordered selection and covered page members;
      payload_hash fingerprints the exact writer-visible page, claim and related-node values. Both use the exact compact-JSON
      algorithms in brief-format.md; generated.graph_version is only a reconciliation trigger.
  - stage: content (article)
    detail: >-
      An entity article is assembled from exactly one brief and bound by its path, hashes and ordered claims. Every live Record
      has one canonical /records/{record_hash}/ route. Until complete review plus current schema-2 PDF/image digest and exact
      source-anchor validation, it is a metadata-only noindex shell; when the complete predicate passes it gains indexed generated
      explanation and claim anchors at the same route.
  - stage: deployment
    detail: >-
      A production build records site and committed content inputs, then compares the complete public path -> exact-byte SHA-256
      map with remote storage. Changed deployments are current only after cache purge and sampled live-byte equality.
