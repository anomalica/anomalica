      - "Each anchor has keys in order asset_hash, asset_file_page, asset_text_sha256, asset_span; asset_span has keys start,
        end. Sort the copied list lexicographically by asset_hash, numerically by asset_file_page, lexicographically by asset_text_sha256,
        then numerically by span start and end. Exclude record_page, body_span, quote and claim wording."
      - "Hash the 26 ASCII bytes `anomalica-source-anchor-v1`, one zero byte, then the JSON bytes. The public source_anchor_id
        is the first 32 lowercase hex characters; a page build fails on a truncated-id collision."
    fixture:
      json: '{"schema":"anomalica/source-anchor-identity/1","anchors":[{"asset_hash":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","asset_file_page":4,"asset_text_sha256":"sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","asset_span":{"start":340,"end":517}}]}'
