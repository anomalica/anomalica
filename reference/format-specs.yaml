# Canonical document-format specification (machine-readable single source of truth)
#
# Every Anomalica document type's header/frontmatter fields and the hash chain that
# links them, in one place. Consumers (the site's architecture page, tooling) read THIS
# file directly and must not hand-copy these fields elsewhere - that is the duplication
# this file exists to prevent. The prose companions under architecture/ (ingest-format.md,
# digest-format.md, brief-format.md, content-format.md) carry the narrative (body grammar,
# parser behaviour, examples); the field list is canonical here.
#
# HARD RULE: no cost/billing/dollar fields appear in any document or in this file. Per-call
# AI usage is provenance only (model, version, token counts). Any notional cost a consumer
# wants to show is derived by that consumer from published list prices, never stored here.
# Enforced 2026-07-23: producers were emitting notional_cost_usd + price_basis in violation
# (59 digests, 53 articles; content/ feeds the public site). Both dropped at the producer,
# no bulk rewrite - they clear as artefacts regenerate, so pre-2026-07-23 files may carry
# them. The spec was always right here; the emitters drifted. See 0037 (amended) and
# digest-format.md#ai_usage. Nothing is lost by deriving: extracted_at dates the run, so
# the applicable price era stays recoverable without a stored basis.
#
# spec_version is this file's own version; each type's `schema` is the document schema it
# describes. `status: stable` = grounded in a ratified spec doc; `status: provisional` =
# the underlying design is not yet settled (do not treat as final).

spec_version: 13
types:
  asset:
    schema: anomalica/asset/1
    status: stable
    serialisation: embedded YAML object in anomalica/record/3
    spec_doc: decisions/0051-asset-record-selection-and-evidence-identity.md
    summary: One immutable acquired byte sequence, or an explicitly linked retained derivative, archived and resolved by its
      exact SHA-256 independently of every Record that selects it.
    fields:
      - {name: asset_hash, type: string, required: true, description: "Full `sha256:<64 lowercase hex>` of the exact acquired
          bytes. The archived original is `records/{bare_asset_hash}.{archived_ext}`."}
      - {name: file_format, type: string, required: true, description: "Normalised retained file format."}
      - {name: archived_ext, type: string, required: true, description: "Bare archive extension; stored rather than inferred
          from codec or container metadata."}
      - {name: source_type, type: string, required: true, description: "Acquisition medium: pdf, audio, video, web, ebook
          or image."}
      - {name: pages, type: integer, required: paged, description: "Positive physical page count. A standalone image has one
          page."}
      - {name: acquisition, type: object, required: true, description: "Copy/acquisition facts. Exactly `{acquired_at, fetched_url?,
          source_file?, copy_identifiers?}`: acquired_at is the required canonical RFC 3339 acquisition instant; fetched_url
          is the URL actually retrieved; copy_identifiers is keyed by scheme and identifies this acquired manifestation. Canonical
          work source_url and work identifiers belong only to Record provenance; missing optional values are omitted."}
      - {name: copyright, type: object, required: true, description: "Rights and access authority for this Asset. Every member
          of a multi-Asset operation is checked independently; one permitted or possessed member never unlocks another."}
      - {name: derived_from, type: object, required: derivative-only, description: "Explicit immutable-Asset lineage `{asset_hash,
          transform}`. Acquired originals omit it; retained renders, audio extractions and frozen snapshots require it."}
    invariants:
      - "Asset identity is exact bytes. A recapture, derivative or re-encoding is another Asset with explicit lineage."
      - "No synthetic container is created for a composite Record and no original is addressed by Record content_hash."
  record_identity:
    schema: anomalica/record-identity/1
    status: stable
    serialisation: compact UTF-8 JSON under a fixed domain prefix
    spec_doc: decisions/0051-asset-record-selection-and-evidence-identity.md
    summary: Stable Record identity derived only from the canonical ordered Asset Selection.
    selectors:
      whole: "Exactly `{type: whole}`. Successful ordinary acquisition uses it for every source type and creates exactly one
        default Record unless that identical canonical Selection exists. Workbench composition accepts it only for a standalone
        image; whole Assets of other formats are not structurally edited by this contract."
      pdf_page: "Exactly `{type: pdf_page, page: N}`, where N is a positive 1-based physical page ordinal in the named PDF
        Asset."
    canonicalisation:
      - "An authoring-only pdf_page_range has positive physical-page bounds start <= end, both inclusive. Expand it to atomic
        pdf_page values start..end in increasing order before preview, hashing or persistence; persisted output contains no
        range selector."
      - "Do not sort. Reject repeated or overlapping pages, repeated whole Assets, whole combined with another selector for
        the same Asset, unsupported selectors, wrong formats and out-of-bounds pages."
      - "Encode exactly `{'schema':'anomalica/record-identity/1','selection':[...]}` as compact JSON with no whitespace or
        newline; actual JSON uses double quotes. Top-level key order is schema, selection. Element key order is asset_hash,
        selector. Selector key order is type, then page where present."
      - "Hash the 28 ASCII bytes `anomalica-record-identity-v1`, one zero byte, then the JSON bytes. Prefix the lowercase
        SHA-256 with `sha256:`."
    fixture:
      json: '{"schema":"anomalica/record-identity/1","selection":[{"asset_hash":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","selector":{"type":"pdf_page","page":4}},{"asset_hash":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","selector":{"type":"pdf_page","page":5}},{"asset_hash":"sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","selector":{"type":"whole"}}]}'
      content_hash: sha256:cf74ff9325207f22d92ff805386830db6066ef1ec8a70fa00ce2adc850ff89f3
    exclusions: [title, URLs, rights, provenance, printed page labels, extraction output, mutable metadata]
  ingest:
    schema: anomalica/record/3
    status: stable
    serialisation: markdown + YAML frontmatter
    spec_doc: architecture/ingest-format.md
    summary: Atomic implementation envelope containing one authoritative Record definition and its current generated Ingest
      body.
    source_types: [pdf, audio, video, web, ebook, image]
    # `formats` on a field lists the source_types it applies to, ONLY where the spec states
    # it. A field with no `formats` key applies to all source_types (or is reviewer-optional).
    temporal:
      authority: Canonical lexical and serialisation contract for every calendar value in an ingest.
      yaml_scalar: string
      yaml_style: quoted
      lifecycle:
        current_flat_provenance_paths: [date_published, posted_date, date_accessed]
        target_provenance_paths: [provenance.published_date, provenance.posted_date, 'assets[].acquisition.acquired_at']
        target_rule: The target paths are not writable until component migrations implement accepted decisions 0043 and 0051;
          publication values migrate to Record provenance while acquisition time migrates to each Asset. No value is copied
          into both layers.
      forms:
        reduced_date:
          grammar: YYYY or YYYY-MM
          pattern: '^(?!0000)[0-9]{4}(?:-(?:0[1-9]|1[0-2]))?$'
        full_date:
          grammar: YYYY-MM-DD
          pattern: '^(?!0000)[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$'
        rfc3339_timestamp:
          grammar: RFC 3339 timestamp with mandatory Z or numeric +HH:MM/-HH:MM offset; seconds are 00-59 and leap seconds
            are unsupported
          pattern: '^(?!0000)[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$'
        utc_timestamp:
          grammar: RFC 3339 timestamp in UTC, ending in Z; seconds are 00-59 and leap seconds are unsupported
          pattern: '^(?!0000)[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]+)?Z$'
      fields:
        - paths: [date_published, posted_date, provenance.published_date, provenance.posted_date]
          forms: [reduced_date, full_date, rfc3339_timestamp]
          producer_rule: Emit only the precision and time the source evidences. A date is never padded to midnight and an
            absent date is never replaced with the current date. The source_offset_rule applies to timestamps.
        - paths: [date_accessed, 'assets[].acquisition.acquired_at', 'snapshots[].asset.acquisition.acquired_at']
          forms: [rfc3339_timestamp]
          producer_rule: Emit the actual acquisition instant with an explicit offset; do not truncate it to a date.
        - paths: [date_extracted, review_carryover.at, refresh_refused.at]
          forms: [utc_timestamp]
          producer_rule: Emit the actual machine event instant in UTC.
        - paths: ['annotations.message.date']
          forms: [rfc3339_timestamp]
          producer_rule: Emit only a parsed message instant with an explicit offset; omit the structured value when the source
            has no valid instant. The source_offset_rule applies.
        - paths: [release.release_date, copyright.granted_at, copyright.expires, 'assets[].copyright.granted_at', 'assets[].copyright.expires']
          forms: [full_date]
          producer_rule: Emit only an evidenced, valid calendar day; reduced precision and timestamps are not allowed.
      source_offset_rule: Preserve source-supplied Z as Z and preserve a numeric offset's value. Canonicalise source syntax
        only as needed for RFC 3339, such as -0500 to -05:00; never normalise a valid source instant to another offset.
      validation:
        - Match the complete scalar against one allowed form for its field, then validate that it denotes a real Gregorian
          calendar value and, for timestamps, a valid RFC 3339 instant. A regex match alone is insufficient.
        - Invalid values fail validation. A producer or editor must never make one pass by truncating it, padding it, substituting
          the current date, fabricating midnight UTC or degrading it to a lower-precision value.
        - Consumers may compare timestamps by instant but must not rewrite the stored value merely by reading and saving a
          record.
        - Validate the scalar token before a YAML library can implicitly construct an integer, date or datetime. Every canonical
          writer emits a quoted YAML string, including full dates and timestamps.
      legacy_read:
        scope: Existing records only; these forms are non-canonical and no producer may emit them.
        forms:
          implicit_yaml_scalar: An unquoted token whose characters otherwise match a canonical form, even when the YAML loader
            constructs an integer, date or datetime instead of a string.
          space_separated_timestamp: A timestamp otherwise equivalent to rfc3339_timestamp but using one ASCII space instead
            of T. Existing values may be quoted or unquoted.
          date_only_acquisition: A full_date in date_accessed.
          offset_extraction_timestamp: An rfc3339_timestamp ending in a numeric offset rather than Z in date_extracted.
          source_native_release_date: An existing non-ISO release.release_date retained as source text pending evidence-based
            correction; it is not a temporal value consumers may parse or compare.
        consumer_rule: A non-temporal edit must preserve a legacy token byte-for-byte. Editing that temporal field writes
          a canonical quoted value; automated migration requires evidence and must not infer missing precision or timezone.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/record/3` for explicit Assets, ordered Selection
          and page mapping. `/1` and `/2` are legacy-readable under the implicit whole-Asset rule."}
      - {name: content_hash, type: string, required: true, description: "Stable Record identity in full `sha256:<64 lowercase
          hex>` form, computed only from the canonical expanded ordered Selection under anomalica/record-identity/1."}
      - {name: assets, type: list, required: record/3, description: "Non-empty unique Asset descriptors in first-selection-use
          order. Exact item shape is types.asset. Every selected asset_hash appears exactly once."}
      - {name: selection, type: list, required: record/3, description: "Non-empty ordered `{asset_hash, selector}` list. Persisted
          selectors are atomic whole or pdf_page values from types.record_identity. Order is identity-bearing."}
      - {name: page_map, type: list, required: paged-record/3, description: "Complete server-derived sequential mapping of
          `{record_page, asset_hash, asset_file_page}`. record_page is exactly 1..N in Selection order; asset_file_page is
          a physical 1-based PDF page or 1 for a standalone image. Printed labels are not coordinates."}
      - {name: title, type: string, required: true, description: "Document or episode title. Always quoted. Lives only in
          frontmatter, never injected into the body."}
      - {name: source_types, type: list, required: record/3, description: "Non-empty ordered unique acquisition media derived
          from selected Assets in first-use order. Supports mixed PDF/image and later multi-format Records without inventing
          a fake composite medium."}
      - {name: source_type, type: string, required: legacy-or-homogeneous, description: "Legacy scalar projection; HOW the
          source arrived: pdf, audio, video, web, ebook,\n          image. Orthogonal to document_type (WHAT it is) - a photographed
          slide and a scanned pdf of the same memo differ\n          in source_type and share a document_type. `image` (jpg/jpeg/png/webp)
          is a photographed or scanned document,\n          handled on the pdf vision path and hashed as source BYTES like
          any scan; it is not a container. In record/3 it may be emitted only when every selected Asset has one source type;
          mixed Records omit it and use source_types."}
      - {name: file_format, type: string, required: legacy-or-single-asset, description: "Legacy Record-level projection.
          In record/3 each Asset owns file_format. FORMAT of the file held: a bare lowercase normalised token such as pdf,
          epub, html, jpg or opus. Always deterministically derived and never reviewer-editable. For audio and video it names
          the selected Asset's actual retained file. An audio extraction from acquired video is a distinct derivative Asset
          with explicit lineage; the acquired video Asset remains archived. Normalise ogg/oga to opus, jpeg to jpg and htm
          to html. This supersedes archived_ext as the format vocabulary; archived_ext remains the storage-locator field while
          consumers migrate. A file format does not imply document_type: EPUB never by itself means book."}
      - {name: word_timestamps, type: boolean, required: false, description: "Present and true on `anomalica/record/2` transcripts
          that carry per-word `{{t:}}` markers."}
      # CURRENT FLAT FIELDS (2026-08-16). These are what records actually carry - 242 of 257 live
      # records have no provenance block at all. They are superseded by `provenance` WHEN 0043 SHIPS;
      # until then they are the live contract and a validator must accept them.
      - {name: date_published, type: string, required: false, description: "Source publication date or evidenced publication
          instant. Exact forms and serialisation are defined by `temporal`; never guess precision. -> provenance.published_date."}
      - {name: source_url, type: string, required: false, description: "Canonical URL of the original. -> provenance.source_url."}
      - {name: fetched_url, type: string, required: false, description: "URL actually retrieved when different (e.g. Wayback).
          Legacy /1-/2 field; migrates to the matching Asset acquisition block."}
      - {name: source_id, type: string, required: false, description: "Legacy native identifier. Migration classifies it as
          an Asset copy identifier or Record work identifier from evidence; it is never copied to both."}
      - {name: source_file, type: string, required: false, description: "Legacy original filename of a local-file ingest;
          migrates to the matching Asset acquisition block."}
      - {name: publisher, type: string, required: false, description: "The WORK's issuing body - who originated it, NOT the
          channel a copy came from (that is posted_by). No longer written from channel metadata; ABSENT until the work is
          identified, which is the not-evidenced convention, not a gap to fill. -> provenance.publisher."}
      - {name: posted_by, type: string, required: false, description: "The channel or site THIS COPY came from - all the fetcher
          can observe. Distinct from publisher: an archival re-upload has both. Filing a redistributor as publisher made 8
          re-uploads of one 1997 broadcast count as 8 independent provenance roots, corrupting the 0044 evidence model. ->
          provenance.posted_by."}
      - {name: container_title, type: string, required: false, description: "The journal, book, or programme the WORK appeared
          in (Scientific Reports; Topological Foundations of Electromagnetism; 11Alive News Extra). One field for all three,
          per CSL container-title. Different axis from posted_by: the venue OF THE WORK, not the channel that reposted a copy."}
      - {name: posted_date, type: string, required: false, description: "When that channel posted this copy. Distinct from
          date_published (when the WORK was issued) and from date_accessed (when we fetched it). Exact forms are defined by
          `temporal`. -> provenance.posted_date."}
      - {name: creators, type: list, required: false, description: "Human author(s)/host(s), person names in natural order.
          -> provenance.creators."}
      - {name: authors, type: list, required: false, description: "LEGACY ALIAS of creators. Being unified onto creators;
          do not emit new."}
      - {name: description, type: string, required: false, description: "The source''s OWN blurb, verbatim, never AI. -> provenance.description."}
      - {name: date_accessed, type: string, required: false, description: "The source retrieval instant. Exact forms are defined
          by `temporal`. Legacy /1-/2 field; migrates to assets[].acquisition.acquired_at."}
      - {name: also_published_at, type: list, required: false, description: "Evidenced alternate work locators. TOP-LEVEL
          on legacy data; the provenance block places it nested. URL match finds an acquisition/work candidate but never proves
          Selection identity, suppresses a requested new Record or collapses Records mechanically."}
      - {name: speakers, type: list, required: false, formats: [audio, video], description: "Names associated with a recording
          (57 records), UNVALIDATED - populated from source metadata, so values include channel names (Lehto Files) and session
          labels (Ross Coulthart Q&A) alongside actual people. NOT an identified-speaker roster and not a clean creators/speakers
          split; semantics pending the ingester. Do not build against it as a person list."}
      - {name: review_carryover, type: object, required: false, description: "Review state preserved across a re-extraction
          (6 records) so a reviewer''s work survives a body rewrite. {at, from, had_text_edits}. The workbench READS it and
          never writes it, lifting it into its listing to render such a record as verify rather than reviewed - load-bearing:
          drop it and the workbench silently stops telling a carried-over review from a real one."}
      - {name: provenance, type: object, required: false, status: target, description: "TARGET SHAPE, NOT YET EMITTED - decision
          0043 is accepted and unimplemented; 242 of 257 live records have no provenance block, and the 15 that do carry war.gov
          catalogue vocabulary (agency/virin/dvids_id/incident_date), not this one. Was listed required:true, which meant
          zero live records validated. Consumers read the flat fields above until the migration lands. Canonical source-origin
          block (decision 0043 as layered by 0051; narrative + example in ingest-format.md). Record/3 sub-fields, each OMITTED
          when absent (never null): collection; publisher; creators; published_date; posted_by and posted_date; source_url
          (canonical public location of the work); identifiers (work ids such as ISBN, DOI or VIRIN); description; audience;
          disclosure. Copy acquisition time, fetched URL, local filename and copy identifiers belong only to each Asset's
          acquisition block. Legacy /1 and /2 provenance may still carry those old fields read-only. The description is the
          source's OWN blurb, verbatim, never AI - omitted or truncated for licensed/restricted sources per copyright.status).
          SOURCE facts only - a subject's incident place and date are claims, not provenance. Copyright is NOT mirrored here;
          assets[].copyright is authoritative in record/3 and the top-level legacy projection remains authoritative only in
          /1 and /2. Origin-unknown is simply the absence of source_url/fetched_url/source_file/identifiers. Also carries
          AUDIENCE (internal | public - who the source was written FOR; the evidential axis, since an internal record made
          by people expecting secrecy has no performative incentive) and DISCLOSURE (published | declassified | foia | subpoena
          | leaked | unknown - the authenticity axis; a FOIA release is attested by the holding agency, a leak by nobody).
          Keep them separate: folding disclosure into audience lets an unauthenticated document inherit a compelled release's
          credibility. Narrative in ingest-format.md."}
      - {name: document_type, type: string, required: false, description: "WHAT the artefact is, orthogonal to source_type
          which is HOW it was acquired. Closed set: book, paper, report, article, letter, email, statement, form, transcript,
          slide, interview, documentary, podcast, lecture, broadcast, recording, footage. Footage is visual moving-image material
          presented as captured scenes or events, distinct from an organised programme, generic recording and source_type
          video. EMIT ONLY WHERE DERIVABLE WITHOUT INFERENCE - the artefact STATES its form (RFC822 headers parse; a page
          headed MEMORANDUM FOR RECORD) - otherwise ABSENT for a reviewer to set. Never derive book from an EPUB container
          and never model-judge from appearance: a guessed value is indistinguishable from a derived one and a wrong value
          stops a human looking, where absence invites it. Describes the WHOLE record, so a FOIA pdf holding many emails is
          not document_type email - its correspondence is marked in the body with message-boundary annotations. See ingest-format.md."}
      - {name: email, type: object, required: false, description: "Format-native email structure where document_type is email,
          parsed deterministically from RFC822 headers (stdlib email parser, no model). {from, to, cc, subject, in_reply_to,
          references} with participants as {name, address}. Does NOT repeat published_date or creators - the Date header IS
          provenance.published_date (authoritative) and From IS provenance.creators; Message-ID goes to provenance.identifiers.
          dkim_verified is optional and absent means NO SIGNATURE IN THIS COPY, never verification-failed."}
      - {name: archived_ext, type: string, required: legacy, description: "Legacy single-Asset projection. In record/3 this
          belongs on each assets[] item. Extension of the archived original, bare and without a dot (opus, ogg, pdf, epub,
          html). Legacy consumers combine it with source_hash when present and otherwise legacy content_hash. Record/3 always
          uses assets[].asset_hash. NOT DERIVABLE from any other field, and must never be re-derived from `container`: codec/container
          describe the STREAM, the extension is a property of the FILE. yt-dlp writes .opus while reporting container: ogg;
          a download named .ogg reports an identical stream - so 76 of 122 records had container: ogg against a .opus file,
          and a container-derived URL 404s for the majority. DISTINCT from source_file (the ORIGINAL filename of a local-file
          ingest): a video archived audio-only legitimately shows source_file: interview.mkv with archived_ext: opus. Do not
          reconcile the two - they describe different files."}
      - {name: source_hash, type: string, required: legacy, description: "Legacy Asset locator only. Historically emitted
          mainly for web and ebook, but migration accepts any /1 or /2 Record carrying it. Existing /1 and /2 records interpret
          source_hash as their implicit whole Asset hash when present. Record/3 producers put every Asset hash in assets[]
          and never emit this field."}
      - {name: structural_parents, type: list, required: false, description: "Record content_hash values from which this Record
          was structurally split or composed. One-to-many lineage; not replacement supersession."}
      - {name: work_provenance, type: object, required: false, description: "Human-evidenced work identity, exactly `{root_id,
          evidence}`. root_id is a stable non-empty opaque id; evidence is a non-empty ordered list of references or concise
          evidence statements. Absence is unknown. A title, page boundary or Asset difference alone cannot populate it."}
      - {name: legacy_identities, type: list, required: migrated-record/3, description: "Non-empty migration-only list of
          exact old `{schema, content_hash}` identities. It is resolvable only through anomalica/record-identity-map/1 and
          is excluded from new Record identity."}
      - {name: structure_status, type: enum, required: false, description: "`temporary` only when this live record is explicitly
          awaiting a structural split/composition operation. Omission means final. Structural outputs are final and omit it."}
      - {name: retired_into, type: list, required: retired-structural-parent, description: "Non-empty child Record content_hash
          list created in the same atomic CAS-bound commit that retired this temporary parent. Never represented by scalar
          superseded_by. The parent remains at its canonical store path for resolution; live discovery excludes it."}
      - {name: snapshots, type: list, required: false, formats: [web], description: "Sibling capture Assets. Each is exactly
          `{role, asset}` where role is page_render or single_file and asset has the complete types.asset shape including
          derived_from lineage. Exposes PDF renders and frozen-page captures without creating an untyped second byte identity."}
      - {name: pages, type: integer, required: false, formats: [pdf, image], description: "Page count for documents.\n          Always
          1 for source_type image - a photographed or scanned page is a single-page document."}
      - {name: duration, type: number, required: false, formats: [audio, video], description: "Length of the FILE in seconds,
          measured from the archived original - NOT the transcript's span. A file ending in silence or outro music runs on
          past its last word; writing the last segment's end here understated every record in the corpus by up to 82s."}
      - {name: date_extracted, type: string, required: false, description: "When the ingestion pipeline ran. Exact UTC form
          and serialisation are defined by `temporal`."}
      - {name: copyright, type: object, required: legacy-only, description: "Legacy /1 and /2 Record-level copyright status
          object (see source-types-and-copyright draft). status is one of public_domain, open_licence, publicly_accessible,
          licensed, restricted. Only public_domain and open_licence serve the ORIGINAL file openly; the rest gate it behind
          proof of possession. DEFAULTS BY ACQUISITION (most specific wins, narrative in ingest-format.md): an explicit --copyright
          > a .gov/.mil URL -> public_domain (US government works carry no copyright, 17 USC 105 - gating one hides a public
          document for no benefit; match the HOSTNAME, never the string, or 'example.com/fake.gov/x.pdf' opens copyrighted
          material) > any other http(s) URL -> publicly_accessible (retrieving it anonymously PROVES public accessibility;
          the original still stays gated, the extracted text is surfaced) > a local file -> restricted (unknown provenance,
          fail closed). These are defaults a reviewer can override, not licence determinations; widening one (gated -> open)
          is irreversible once served and is a human decision, never an automated upgrade. `copyright.media` carries the status
          of EMBEDDED MEDIA separately (absent = inherits status): a publisher can only licence what it owns, so a CC BY 4.0
          report built around witness-submitted photographs is open_licence text with restricted media. NEVER collapse a record
          to the most restrictive of its parts - that gates the publisher's own open analysis. Set at acquisition by a human
          wherever the licence carries a third-party carve-out; the handler cannot infer it. Media with absent/unknown status
          fails closed. For hosted model input, public_domain and open_licence are the only status-based admissions; publicly_accessible,
          licensed, restricted, absent and unknown deny. Local processing remains subject to separate local-use controls.
          Existing copyright evidence fields, source URLs, prior tools, review state, privacy/ZDR properties and spend approval
          never grant hosted-input rights. Check every submitted body/media unit and deny a mixed invocation or batch when
          any unit is ineligible or unresolved. This follows the payload across canonical, comparison/variant, benchmark/evaluation,
          retry, backfill, manual, direct component and standalone-harness entrypoints. Route labels and dry-run labels grant
          nothing; only a true no-provider, no-payload dry run is outside the gate. Every provider-capable component rechecks
          at its final pre-provider boundary; an upstream scheduler check is defence in depth. Record/3 producers never emit
          this projection: assets[].copyright is authoritative and every operation evaluates each selected member independently.
          Evaluation-specific private permission must bind and be verified for the exact record, use, provider, route and
          necessary processors; registry limits alone are descriptive."}
      - {name: quality, type: object, required: false, description: "Condition of the record's TEXT AS DELIVERED - attributes
          no fault (a U+FFFD is unattributable between a damaged source and a bad decode), hence `quality` not `source_quality`.
          A DERIVED CACHE regenerated by the detector, never authoritative over the body; exists so consumers filter without
          parsing every body. Caches only what costs a body read: replacement_chars (U+FFFD count), substitution_score (OCR
          proper-noun inconsistency), page_anchors (printed_page marker count), chapter_titles (bool). NOT stored because
          derivable from adjacent frontmatter: garbled (from replacement_chars vs the CURRENT threshold - a stored flag goes
          silently wrong when the threshold moves, exactly as a stored cost does when a price moves), author_present (from
          creators), title_sane (from title). Omit a field the source_type cannot have; where applicable it is present INCLUDING
          zero (page_anchors: 0 means measured-and-none, not inapplicable). Additive-optional: no schema bump."}
      - {name: release, type: object, required: false, description: "Release/declassification provenance stamped ON the page
          (red overlays, handling caveats, release-control footers) rather than typed in it. Fields: declassified_by (person
          name), declassified_by_title, control_number, released_to, release_date, handling (list), markings (VERBATIM list,
          REQUIRED when the block is present, may be []). Evidence behind provenance.disclosure - the two must agree; distinct
          from `classification`, which is the PRIOR state. markings: [] means EXAMINED-NONE-FOUND; an ABSENT block means NOT
          EXAMINED - that distinction is the whole point. Absent is NARROW: pre-block records, or source types with no page
          furniture. NOT scanned pdfs - the handler reads every page as an image, so a text-layer-less scan is examined like
          any other (pdftotext reporting it empty is an instrument artefact, not a handler limit). Per-page Bates sequence
          numbers do NOT belong here; they ride the page-boundary annotation. The declassifying officer becomes a node via
          a digester administrative claim, never directly from frontmatter."}
      - {name: classification, type: string, required: false, formats: [pdf], description: "Original security classification
          banner, verbatim with parentheses stripped (e.g. SECRET//REL TO USA, FVEY). Present only for documents carrying
          a marking."}
      - {name: processing, type: object, required: false, description: "Processing metadata: handler, version (git short-hash),
          tools, source characteristics and asset_pipeline_versions. The latter is a complete first-selection-use ordered
          list of `{asset_hash, source_type, pipeline_version}` for record/3; each positive version is compared only with
          that source_type's explicit store/_pipeline_versions.yaml entry. The legacy scalar pipeline_version is valid only
          for /1 and /2. Every selected Asset must be equal/current; lower is stale, while absent, malformed, ahead or a missing
          manifest entry is unknown. Producers never default an unregistered type to generation 1."}
      - {name: supersedes, type: string, required: false, description: "content_hash of the prior record this one retired,
          when a re-ingest of the same logical source (its `provenance.source_url` / `provenance.identifiers`) superseded
          an earlier extraction. Stamped across schema boundaries. See 0040."}
      - {name: superseded_by, type: string, required: false, description: "content_hash of the record that superseded this
          one. Consumers exclude any Record carrying superseded_by or retired_into from the live set. Replacement records
          follow 0040; structural parents remain resolvable at their canonical path. Never substitute one marker for the other."}
      - {name: media, type: object, required: false, description: "Summary of extracted media stored at media/{record_hash}/.
          Currently {count, total_bytes}. Omitted when the record has no extracted media."}
      - {name: ai_usage, type: object, required: false, status: provisional, description: "PROVENANCE-ONLY record of AI processing
          that produced this record (model, version, token counts). No cost fields. Exact sub-field shape pending confirmation
          from the ingester workspace - emitted by the pipeline but not yet in ingest-format.md."}
      - {name: overlay_next_id, type: integer, required: false, description: "The next overlay-marker id to mint. Highlights,
          span notes, links AND the references between them share ONE per-record id space; this counter only ever increases,
          so no id the record has ever mentioned in any overlay construct is reissued - which keeps highlight context links
          and shareable (record-hash + id) link addresses from silently rebinding to a different span. It is not a decodable
          index (records may hold legacy or hand-written ids that are not counter renderings; the counter just refuses to
          collide with them). Written by the workbench, not the ingester. Absent on records with no overlay markers; when
          absent, derive the high-water from the largest id mentioned anywhere in the body (markers and references alike,
          since a dangling reference can be the only thing naming an id), clamped up to the authoring UI's minimum id - a
          fresh record starts at that minimum, not zero. See ingest-format.md."}
    sidecars:
      "records/{asset_hash}.peaks.json": "Waveform amplitude envelope of one archived Asset, audio/video only, schema anomalica/peaks/1.
        {schema, hex_hash, bins_per_second, duration, peaks}. `peaks` is one unsigned byte per bin, base64; each bin is the
        MAXIMUM absolute sample in its slice, never the average (an average flattens the onset the waveform exists to show).
        Reduction is single-sourced in anomalica-common/peaks.py - two components run it and a drift between them is silent.
        `duration` is DERIVED from the decoded audio and is the authoritative span for mapping the peaks: len(peaks)/duration
        == bins_per_second holds here and nowhere else. Do NOT map onto a player's duration (YouTube rounds to the whole second),
        a media element's (measures the container, not the decode), or the record's frontmatter `duration` (the FILE's length
        - a different quantity). ACCESS: peaks follow the TRANSCRIPT's allow-list, not the archived original's - open for
        public_domain, open_licence AND publicly_accessible, so a copyrighted source's audio stays gated while its envelope
        is served openly (Mark's ruling 2026-07-17; an envelope is a weaker derivative than the transcript, which is already
        public for those). The two allow-lists MUST NOT be collapsed: merging withdraws the ruling or leaks the audio. Route
        per object kind, never once per record. Everything else - licensed, restricted, unknown, absent - fails closed."
      "housekeeping-algorithm.json": "Scheduler-owned canonical deployed housekeeping algorithm manifest, schema anomalica/housekeeping-algorithm/1.
        Scheduler and Workbench read it at the same Git ref as record and sidecar; missing, malformed or worker-mismatched
        state fails closed."
      "store/{content_hash}.housekeeping.json": "Proposal-only housekeeping result, schema anomalica/housekeeping/3. Both
        passes bind to complete exact ingest Markdown bytes by input_sha256; authenticated decisions record result_sha256
        and ordered decision audit through the Workbench. See the housekeeping type below."
      "store/{bare_content_hash}.gold.json": "Compact human-gold evaluation sidecar, schema anomalica/highlight-gold/1. Existing
        inline highlight ids are the source units; this sidecar stores decisions, accepted facts, progress and bounded-range
        attestation without duplicating highlight spans or context edges. Bound to the exact raw body by body_sha256."
  ingest_result:
    schema: anomalica/ingest-result/1
    status: stable
    serialisation: compact JSON file + prefixed stdout line
    spec_doc: architecture/ingest-result-format.md
    summary: Post-commit ingester result consumed by the scheduler. It names the produced live record explicitly; consumers
      never derive a record path from the intake hash. Before acceptance, the scheduler independently reads record_path from
      commit_sha's tree and verifies the blob's parsed content_hash.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/ingest-result/1`."}
      - {name: run_uuid, type: string, required: true, description: "Canonical lowercase scheduler-supplied UUID."}
      - {name: outcome, type: enum, required: true, description: "`committed` or `no-op`."}
      - {name: record_path, type: string, required: true, description: "Normalised POSIX path relative to the ingests repository;
          no absolute, empty, dot or dot-dot segments. Resolves to the produced live record."}
      - {name: content_hash, type: string, required: true, description: "Full `sha256:<64 lowercase hex>` parsed from the
          produced record."}
      - {name: commit_sha, type: string, required: true, description: "Full lowercase 40- or 64-hex Git object id whose tree
          contains record_path with the stated content_hash."}
      - {name: completed_at, type: string, required: true, description: "UTC ISO 8601 timestamp ending in Z, after commit
          verification."}
  record_structure_request:
    schema: anomalica/record-structure/1
    status: stable
    serialisation: JSON API request to POST /api/records/structure/preview or POST /api/records/structure/commit
    spec_doc: architecture/review-workbench.md
    owner: workbench
    summary: CAS-bound private request to split a temporary parent into several Records or compose a full ordered multi-Asset
      Record. The server derives canonical selectors, bodies, page maps, hashes and lineage; clients cannot supply them.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/record-structure/1`."}
      - {name: viewed_ref, type: string, required: true, description: "Full Git commit SHA whose tree supplied every parent,
          Asset and source map used by the preview."}
      - {name: parents, type: list, required: true, description: "Non-empty ordered full Record content_hash list. Every parent
          must be live, carry structure_status temporary and remain byte-identical at commit."}
      - {name: outputs, type: list, required: true, description: "Non-empty ordered requested Records. Each is exactly `{metadata,
          selection}`. metadata permits only title, provenance, work_provenance and document_type; selection is a non-empty
          ordered list of `{asset_hash, selector}` using whole standalone-image, pdf_page or inclusive authoring-only pdf_page_range
          selectors. Unknown fields and client-supplied content_hash, assets, page_map, body, archive paths, rights or lineage
          are forbidden."}
    invariants:
      - "Preview and commit run the same server-side canonical expansion and validation. Commit rejects a changed ref, parent,
        Asset, page count, page text or source map."
      - "Preview invokes no provider and requires existing exact Asset page text and source maps. Commit accepts the identical
        request at the previewed viewed_ref and recomputes it; there is no separately trusted client preview token."
      - "One commit creates every output, writes one-to-many structural lineage and retires every temporary parent. A partial
        write is forbidden; parent review, housekeeping, gold, verification, digest and graph sidecars do not inherit."
      - "Every canonical output selector is contained in the union of the named parents' expanded Selections. Outputs may
        omit or reorder those members, but an unrelated Asset cannot acquire false structural lineage or cause a parent retirement."
  asset_possession_challenge_request:
    schema: anomalica/asset-possession-challenge-request/1
    status: stable
    serialisation: JSON API request to POST /api/assets/{asset_hash}/possession-challenges
    spec_doc: architecture/review-workbench.md
    owner: workbench
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/asset-possession-challenge-request/1`."}
      - {name: use, type: enum, required: true, description: "Exactly review, source_body, archived_original or media."}
  asset_possession_challenge:
    schema: anomalica/asset-possession-challenge/1
    status: stable
    serialisation: JSON API response from POST /api/assets/{asset_hash}/possession-challenges
    spec_doc: architecture/review-workbench.md
    owner: workbench
    summary: Short-lived authenticated proof target for one exact gated Asset. Asset hashes are public identifiers and never
      satisfy the challenge.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/asset-possession-challenge/1`."}
      - {name: challenge_id, type: string, required: true, description: "Server-generated opaque identifier with at least
          128 bits of CSPRNG entropy."}
      - {name: asset_hash, type: string, required: true, description: "Exact full public Asset SHA-256 identifying the target."}
      - {name: use, type: enum, required: true, description: "Exactly review, source_body, archived_original or media."}
      - {name: expires_at, type: string, required: true, description: "UTC RFC 3339 timestamp no more than five minutes after
          issue."}
      - {name: nonce, type: string, required: true, description: "Exactly 32 random bytes encoded as unpadded base64url."}
      - {name: ranges, type: list, required: true, description: "Ordered non-overlapping `{offset, length}` byte ranges. For
          Assets at least 65536 bytes, divide the Asset into 16 contiguous sectors using boundaries `floor(i * asset_size
          / 16)` and CSPRNG-select one 4096-byte range uniformly within each sector. For smaller Assets use one range `{offset:
          0, length: asset_size}`. Empty Assets cannot use possession proof."}
    proof_codec:
      - "Decode nonce, then concatenate the 29 ASCII bytes `anomalica-asset-possession-v1`, one zero byte, the 32 nonce bytes,
        and for each range in order: offset as unsigned 64-bit big-endian, length likewise, then the exact local Asset bytes."
      - "SHA-256 the complete preimage and submit lowercase `sha256:<64 hex>` as anomalica/asset-possession-proof/1. Public
        Asset hashes, Record hashes, quotations and source maps are not inputs substitutable for the challenged bytes."
    invariants:
      - "Challenge state is bound server-side to authenticated session, Asset hash, use and expiry; it is single-use whether
        proof succeeds or fails. Expected proof and bytes are never returned or persisted in Record sidecars."
      - "The server recomputes from its hash-verified archive and compares in constant time. Every gated Asset in a composite
        requires an independent successful challenge or explicit grant."
    fixture:
      nonce: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      ranges: [{offset: 0, length: 3}]
      local_bytes_hex: '616263'
      proof_sha256: sha256:0da69eaa5d8c7d398ec337ee84c7bfe0ffb4620d18e45824ba8ff128785bec74
  asset_possession_proof:
    schema: anomalica/asset-possession-proof/1
    status: stable
    serialisation: JSON API request to POST /api/assets/{asset_hash}/possession-challenges/{challenge_id}/verify
    spec_doc: architecture/review-workbench.md
    owner: workbench
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/asset-possession-proof/1`."}
      - {name: challenge_id, type: string, required: true, description: "Exact outstanding challenge identifier."}
      - {name: proof_sha256, type: string, required: true, description: "Proof from the challenge codec in full `sha256:<64
          lowercase hex>` form."}
  record_identity_map:
    schema: anomalica/record-identity-map/1
    status: stable
    serialisation: YAML at store/_record_identity_map.yaml
    spec_doc: decisions/0051-asset-record-selection-and-evidence-identity.md
    owner: ingester-migration
    summary: Canonical resolver from an exact legacy Record identity to its migrated record/3 identity; written atomically
      with migration and never inferred from titles, URLs or hash resemblance.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/record-identity-map/1`."}
      - {name: entries, type: list, required: true, description: "List sorted lexicographically by old_content_hash. Each
          item is exactly `{old_schema, old_content_hash, new_content_hash}`; old values are preserved byte-for-byte and the
          new value is a full record-identity/1 hash."}
    invariants:
      - "old_content_hash is globally unique and maps to exactly one new content hash; old_schema is audit context. Consumers
        resolve existing hash-only references by exact old_content_hash. Duplicate or conflicting keys are invalid."
      - "Migration writes the new live envelope, old envelope/sidecars under store/legacy-identities/record-{1|2}/ and map
        entry in one CAS-bound commit. Missing bytes or metadata, byte-hash mismatch, or many-old-to-one-new collapse fails
        before writing."
      - "The map resolves references only. It grants no review, digest, graph, rights or sidecar authority."
  review_coverage:
    schema: anomalica/review-coverage/1
    status: stable
    serialisation: JSON
    spec_doc: architecture/ingest-format.md
    path: "store/{bare_content_hash}.review.json"
    owner: workbench
    summary: Current authoritative human observation verdict for one live ingest, bound directly to the reviewed parsed body.
      Version 0 is legacy approximate span data and cannot authorise public record publication. Reviewer identity, notes and
      spans remain private.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/review-coverage/1`."}
      - {name: reviews, type: list, required: true, description: "Append-only private entries `{by, at, spans, notes?, parent_commit?}`;
          each span is `{from, to, kind}`. `parent_commit` is the optimistic-concurrency base, not the reviewed-body revision.
          Never copied into public content."}
      - {name: reviewed_body_sha256, type: string, required: false, description: "Required on every new or updated review
          sidecar, including version 0; optional only on existing legacy data. Full `sha256:<64 lowercase hex>` of the UTF-8
          bytes of the exact body returned by the canonical frontmatter parser, with no further newline, whitespace or Unicode
          normalisation. A present malformed or mismatched value fails closed without legacy fallback. On version 0 it binds
          the approximate spans but does not make observed_coverage or digestible authoritative."}
      - {name: observed_coverage, type: number, required: true, description: "Finite fraction from 0.0 to 1.0 computed over
          the record's review units. Public record eligibility requires exactly 1.0."}
      - {name: digestible, type: boolean, required: true, description: "Workbench verdict under the shared review-gate rule;
          public record eligibility requires true together with observed_coverage 1.0."}
      - {name: total_units, type: integer, required: true, description: "Positive review-unit denominator; zero cannot authorise
          publication."}
    invariants:
      - "Consumers validate reviewed_body_sha256 before legacy fallback. When it is absent, fallback is valid only if the
        sidecar is unchanged from its latest commit, reviews[-1].parent_commit is an actual Git parent of that commit, and
        the current parsed body exactly equals the parsed record body in that commit."
      - "A later metadata-only record commit preserves currentness when the parsed body is unchanged. An unresolved review_carryover
        remains independently invalid."
  evaluation_registry:
    schema: anomalica/evaluation-registry/2
    status: stable
    serialisation: YAML
    spec_doc: architecture/evaluation-format.md
    path: reference/evaluations.yaml
    owner: anomalica
    summary: Static public cross-repository descriptors for reference datasets and experiments. Dynamic lifecycle, gold readiness,
      blockers and decisions come only from validated owner-produced evidence state.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/evaluation-registry/2`."}
      - {name: state_schema, type: string, required: true, description: "`anomalica/evaluation-state/1`, the owner-provider
          output every descriptor resolves."}
      - {name: statuses, type: list, required: true, description: "Exact lifecycle vocabulary: proposed, ready-for-human-review,
          reviewed, adopted, rejected and blocked."}
      - {name: gold_statuses, type: list, required: true, description: "Exact gold-readiness vocabulary: unavailable, source-reviewed,
          provisional, ready-for-human-review, human-reviewed and reviewed-derived."}
      - {name: evaluations, type: list, required: true, description: "Static descriptors `{id, title, purpose, owner_repo,
          evidence, limits, artifacts?}`. Evidence is `{provider_id, detail_capability}`; each artifact is `{id, role, visibility,
          repository?, path?}`. Lifecycle, gold and decision fields are forbidden here."}
    invariants:
      - "Evaluation ids and artifact ids are stable, lowercase hyphenated and unique; evaluation ids are never reused."
      - "A public artifact requires an organisation/repository name and repository-relative path. Absolute paths are forbidden."
      - "A private artifact forbids repository and path; authorised consumers resolve only recognised stable ids through local
        configuration."
      - "No source quote, copyrighted body, reviewer identity, private provider/account detail, approval evidence or host
        state appears in the registry."
      - "Rights and route limits are descriptive and never grant dispatch permission; owning-component enforcement remains
        authoritative."
      - "Every descriptor's provider_id names one same-entry role:state artifact and detail_capability names a registered
        backend capability. Missing providers or capabilities fail visibly."
      - "A private state provider can report reviewed, adopted or rejected only through an allowlisted administrator adapter
        that validates current evidence; inaccessible state is a synchronisation error."
  evaluation_state:
    schema: anomalica/evaluation-state/1
    status: stable
    serialisation: JSON
    spec_doc: architecture/evaluation-format.md
    owner: evaluation-owner
    summary: Dynamic owner-derived evaluation lifecycle and gold readiness bound to exact current evidence. This state is
      aggregated for the administrator index but is never copied into the static registry.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/evaluation-state/1`."}
      - {name: evaluation_id, type: string, required: true, description: "Exact id of the static registry descriptor."}
      - {name: evidence, type: list, required: true, description: "Non-empty ordered `{artifact_id, sha256}` list. Public-provider
          ids resolve through the descriptor; a private adapter may also resolve stable item-scoped ids from validated owner
          data. Each hash is full `sha256:<64 lowercase hex>` of exact evidence bytes."}
      - {name: evidence_sha256, type: string, required: true, description: "SHA-256 of compact canonical JSON for the evidence
          list: recursively sorted object keys, order-significant list, no spaces/newline and non-ASCII unescaped."}
      - {name: status, type: enum, required: true, description: "One of the registry's six lifecycle states, derived from
          evidence."}
      - {name: gold, type: object, required: true, description: "Derived `{status, reviewed, total, unit}`. Counts are non-negative
          integers, reviewed cannot exceed total, and unit is a non-empty denominator name."}
      - {name: blocked_reason, type: string, required: blocked-only, description: "Non-empty actionable reason, required exactly
          when status is blocked."}
      - {name: decision, type: object, required: false, description: "Derived `{code, summary}`; code is stable lowercase-hyphenated
          owner vocabulary and summary is concise."}
      - {name: items, type: list, required: false, description: "Per-record or per-slot derived states for collection evaluations.
          Each has stable id, status, gold and optional blocker/decision; safe record_id/review_id are administrator-only
          detail."}
    invariants:
      - "The provider derives all dynamic fields from its referenced evidence; none is manually copied into evaluations.yaml."
      - "Evidence is the complete direct dependency set for the returned dynamic fields. A result cannot substitute for an
        unlisted reference or gold artifact whose bytes affect lifecycle, gold status or counts, blockers, decisions or item
        state."
      - "The aggregator verifies schema, evaluation id, vocabularies, counts, canonical evidence hash and every accessible
        evidence artifact before exposing lifecycle state."
      - "Missing, inaccessible, malformed or stale evidence produces a visible synchronisation error and no current lifecycle."
      - "State dependent on private evidence requires an allowlisted private adapter; a public aggregate cannot establish
        reviewed, adopted or rejected lifecycle from hidden evidence."
  highlight_gold:
    schema: anomalica/highlight-gold/1
    status: stable
    serialisation: JSON
    spec_doc: architecture/evaluation-format.md
    path: "store/{bare_content_hash}.gold.json"
    owner: workbench
    summary: Compact resumable human-gold decisions keyed to existing inline highlight ids. One highlight is one source unit
      yielding one or more accepted facts; multipart pairs remain separately locatable, and context links inform dependent
      units without merging them. Artificial-intelligence candidates remain non-gold until authenticated acceptance.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/highlight-gold/1`."}
      - {name: record_hash, type: string, required: true, description: "The ingest's full `sha256:<64 lowercase hex>` content_hash."}
      - {name: body_sha256, type: string, required: true, description: "Full `sha256:<64 lowercase hex>` of the exact raw
          body after the closing frontmatter fence. Binds range offsets and inline marker semantics; mismatch makes the sidecar
          stale and non-gold."}
      - {name: ranges, type: list, required: true, description: "Non-overlapping bounded review passes. Each is `{id, start,
          end, complete, reviewer, updated_at, attested_at?, units}`. Id is opaque and sidecar-unique; bounds are half-open
          Unicode code-point offsets into body_sha256. Reviewer is server-authenticated `{issuer, subject, name}` and never
          accepted from client input. attested_at is required exactly when complete is true. Units are source-ordered unique
          `{highlight_id, decision, facts?}` entries: accept requires exactly one fact, adjust one or more, split two or more,
          and reject/defer forbid facts. Deferred units prevent completeness. Only facts persisted by an authenticated accept/adjust/split
          save are gold."}
    invariants:
      - "Inline highlight parts and highlight-context edges remain authoritative in the ingest body and are never copied here."
      - "The interface saves source-ordered batches of 3-5 unresolved highlights atomically; persisted decisions are the resume
        cursor, deferred units return after never-reviewed units, and no mutable cursor field is stored."
      - "Optional digest-claim proposals are derived by quote overlap with the current highlight's separate parts, are not
        persisted in this sidecar and never become gold merely by being shown."
      - "Precision, false-positive rate and F1 require a complete range and apply only to model claims whose aligned quote
        fragments are wholly inside the attested range. Incomplete ranges support progress and accepted-fact recall only."
  housekeeping:
    schema: anomalica/housekeeping/3
    status: stable
    serialisation: JSON
    spec_doc: architecture/housekeeping-format.md
    summary: Proposal-only deterministic and subscription-research passes over one exact ingest Markdown input, followed when
      proposals exist by one complete authenticated human decision whose result hash remains current after approved edits.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/housekeeping/3`; v1 and v2 are always due and
          cannot be decided, applied or carried into another tuple under the v3 algorithm manifest."}
      - {name: content_hash, type: string, required: true, description: "Stable source/selection record locator in full `sha256:<64
          lowercase hex>` form; not the examined Markdown digest."}
      - {name: input_sha256, type: string, required: true, description: "SHA-256 of the complete exact raw ingest Markdown
          bytes examined by both passes, in full `sha256:<64 lowercase hex>` form. Immutable for the tuple."}
      - {name: result_sha256, type: string, required: true, description: "SHA-256 of the exact current record bytes. Initially
          equals input_sha256 and changes only in the same authenticated atomic commit that applies the complete reviewer
          decision; live bytes matching it do not retrigger either pass."}
      - {name: checked_at, type: string, required: true, description: "UTC ISO 8601 sidecar creation time before any pass;
          exact form `YYYY-MM-DDTHH:MM:SSZ`; afterwards equals the latest recorded PassState's finished_at."}
      - {name: algorithm_version, type: string, required: true, description: "Non-empty identity of the complete check suite,
          match rules and apply guards."}
      - {name: passes, type: object, required: true, description: "Only fixed keys `deterministic` and `metadata-research`,
          containing recorded terminal attempts over the same input_sha256; a missing key means waiting or queued, never actively
          running. Each PassState has status `completed|failed|waived` and finished_at. Failed also requires error and is
          retryable. Deterministic must complete, cannot be waived and has no usage. Completed metadata research requires
          usage.transport `subscription`; only metadata research may be waived with authenticated `{by, at, reason}` whose
          at equals finished_at. Failed or waived research has no usage. All times have exact UTC form `YYYY-MM-DDTHH:MM:SSZ`;
          research requires completed deterministic and cannot predate it."}
      - {name: items, type: list, required: true, description: "Independently decidable proposals. Frontmatter tagged variants
          are set/clear/move. Body replace-token carries scope, old/new ASCII tokens, fixed case/boundary literals, exhaustive
          whole-file UTF-8 byte spans, expected count, evidence, confidence and status. replace-token additionally requires
          deterministic pass, known-term category and exact check/old/new membership in anomalica_common.housekeeping.KNOWN_TERM_RULES.
          An optional depends_on list names unique same-sidecar item IDs that must also be approved in the same atomic request;
          it is immutable proposal identity. Every item also has pass `deterministic|metadata-research` and category `person-name|known-term|metadata`.
          Duplicate, unknown, self-referential or cyclic prerequisites fail closed. An item requires its named producing pass
          to be completed. May be empty."}
      - {name: decisions, type: list, required: true, description: "Ordered durable audit entries `{item_id, status, decided_at,
          decided_by}`. Initially empty; the one complete authenticated decision appends exactly one entry per item and each
          entry agrees with the item's final status. Superseded tuple and failed-pass history remains in Git."}
    invariants:
      - "Neither pass may rewrite a token merely because it begins a sentence or only to change sentence-start capitalisation;
        person names are excluded from known-term and acronym normalisation. Unregistered replace-token pairs are invalid."
      - "Content review may start only after deterministic is completed, metadata research is completed or waived and every
        proposal is decided. A failed pass remains blocked. Records with human review already started or completed are excluded
        from automatic housekeeping."
      - "All approved operations, statuses, result_sha256 and decision audit entries are committed atomically under the authenticated
        reviewer's identity."
  housekeeping_algorithm:
    schema: anomalica/housekeeping-algorithm/1
    status: stable
    serialisation: 'Exactly 77 UTF-8 bytes: `{ "algorithm_version": "3", "schema": "anomalica/housekeeping-algorithm/1" }`
      plus one LF; no additional fields or other whitespace'
    canonical_example: "{ \"algorithm_version\": \"3\", \"schema\": \"anomalica/housekeeping-algorithm/1\" }\n"
    spec_doc: architecture/housekeeping-format.md
    path: housekeeping-algorithm.json
    owner: scheduler
    summary: Canonical deployed check-and-guard algorithm version. The worker reports its implemented anomalica_common.housekeeping.ALGORITHM_VERSION
      before dispatch; missing, malformed or unequal state fails closed.
    fields:
      - {name: algorithm_version, type: string, required: true, description: "Non-empty ASCII `[A-Za-z0-9._-]+` exact deployed
          algorithm identity."}
      - {name: schema, type: string, required: true, description: "`anomalica/housekeeping-algorithm/1`."}
  housekeeping_view:
    schema: anomalica/housekeeping-view/2
    status: stable
    serialisation: JSON API response
    spec_doc: architecture/review-workbench.md
    endpoint: "GET /api/ingests/{bare_content_hash}/housekeeping"
    additional_fields: false
    summary: Strict access-tagged Workbench envelope. A no-possession gated view exposes processing state/count/scopes/deep-link
      only, with no source-derived or viewed-identity data. A public, trusted-local or possession-granted view binds record,
      raw sidecar and manifest at one committed ingests ref; previews are separate derived data, never sidecar mutations.
    fields:
      - {name: schema, type: string, required: true, description: "`anomalica/housekeeping-view/2`."}
      - {name: access, type: enum, required: true, description: "`summary` without possession or `full` for public/trusted-local/possession-granted
          access."}
      - {name: viewed_sidecar_sha, type: string|null, required: full, description: "Full lowercase 40- or 64-hex Git blob
          id of the committed raw sidecar backing the view; null only when no sidecar exists. Forbidden in summary."}
      - {name: viewed_ref, type: string, required: full, description: "Full lowercase 40- or 64-hex Git commit SHA whose one
          tree supplied manifest, record and sidecar."}
      - {name: viewed_content_hash, type: string, required: full, description: "Full `sha256:<64 lowercase hex>` record identity.
          Forbidden in summary."}
      - {name: viewed_input_sha256, type: string|null, required: full, description: "Exact immutable input_sha256 from a valid
          sidecar; null when absent or invalid. Forbidden in summary."}
      - {name: viewed_result_sha256, type: string|null, required: full, description: "Exact result_sha256 from a valid sidecar;
          null when absent or invalid. Before decisions it equals viewed_input_sha256. Forbidden in summary."}
      - {name: viewed_algorithm_version, type: string, required: full, description: "Version read from the manifest at viewed_ref.
          Forbidden in summary."}
      - {name: review_state, type: enum, required: true, description: "Exactly `due`, `pending-deterministic`, `failed-deterministic`,
          `pending-research`, `failed-research`, `needs-decisions` or `ready`. Missing pass keys are pending; failed attempts
          remain blocked and retryable."}
      - {name: due_reason, type: enum|null, required: true, description: "One of missing-sidecar, invalid-sidecar, unsupported-schema,
          result-mismatch or algorithm-mismatch when due; null for every other review state. Manifest failure makes the endpoint
          unavailable rather than returning a record state."}
      - {name: outstanding_count, type: integer, required: true, description: "Current proposed item count; zero when due."}
      - {name: scopes, type: list, required: true, description: "Distinct sorted `frontmatter`/`body` scopes of current proposed
          items."}
      - {name: deep_link, type: string, required: true, description: "`/housekeeping?record=<bare 64 lowercase hex>`."}
      - {name: sidecar, type: object|null, required: true, description: "Always null in summary. Raw committed sidecar in
          full; null there only when absent or invalid/unreadable."}
      - {name: previews, type: object, required: full, description: "Derived preview map keyed by item id. Forbidden in summary
          and never inserted into or persisted with the raw sidecar."}
    access_variants:
      summary: "Exactly schema, access, review_state, due_reason, outstanding_count, scopes, deep_link, sidecar. sidecar is
        null; no viewed identity, item, old/new token, byte span, evidence or preview. Count/scopes/review-state/due/deep-link
        are permitted metadata."
      full: "All fields above. Returned directly for public/trusted-local records and after every required Asset has an unexpired
        session-bound `review` authorisation from anomalica/asset-possession-proof/1 or an explicit grant. Decisions require
        this variant."
  housekeeping_decision_request:
    schema: anomalica/housekeeping-decision/2
    status: stable
    serialisation: JSON API request
    spec_doc: architecture/housekeeping-format.md
    endpoint: "POST /api/ingests/{bare_content_hash}/housekeeping/decide"
    additional_fields: false
