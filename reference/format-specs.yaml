  housekeeping_research_waiver:
    schema: anomalica/housekeeping-research-waiver/1
    status: stable
    serialisation: JSON API request
    spec_doc: architecture/housekeeping-format.md
    endpoint: "POST /api/ingests/{bare_content_hash}/housekeeping/waive-research"
    additional_fields: false
    summary: Explicit authenticated decision to continue without the automatic subscription research pass, bound to the same
