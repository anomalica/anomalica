# Canonical source for the /architecture/ page details panel.
# Lives in the anomalica meta-repo (reference/architecture.yaml); the site mounts it.
# Each node's copy is data, not code: edit here, no template changes needed.
# The diagram topology is the sibling reference/pipeline.mmd.

nodes:
  raw:
    kind: "Input"
    format: "PDF, EPUB, HTML, audio, or video - any source format"
    zone: "source"
    desc: "The original source material in any format - PDF documents, audio, video, web pages, ebooks. Driven by the existing
      network of references, not external editorial picks."
    output: "Nothing - this is the input."
    contains: "Third-party material in whatever form it was published - documents, broadcasts, articles, testimony."
    copyright: "Follows the source: public-domain and openly-licensed material is free to share; copyrighted material is handled
      under copyright and not republished."
  ingester:
    kind: "Component (Python; Record/3 target planned)"
    zone: "public"
    desc: "Target: acquire immutable Assets, establish an ordered Selection and Record, then generate the structured-text
      Ingest. Current implementation still writes legacy record/1 or record/2 from one input. Per-format handlers cover PDF,
      web, audio/video, ebook and image."
    output: "Target: Asset bytes archived by byte SHA-256, one default whole-Asset Record, and its current Ingest."
    contains: "Just code - an open-source tool. The records it produces inherit the source's copyright, but the ingester itself
      is public."
    copyright: "PUBLIC - open-source code."
  asset:
    kind: "Planned migration data object (immutable)"
    format: "Original bytes plus anomalica/asset/1 metadata"
    zone: "source"
    desc: "One acquired byte sequence, or explicitly linked retained derivative, identified by full SHA-256. It owns archive
      binding, file format, acquisition locator/time and rights/access authority. Several Records may select it."
    output: "Validated immutable input to ordered Record selections."
    contains: "Original third-party bytes; copyright follows each Asset."
    copyright: "Evaluated per Asset. Permission or possession of one Asset never unlocks another."
  record:
    kind: "Planned migration data object (stable identity)"
    format: "anomalica/record/3 frontmatter"
    spec: ingest
    zone: "source"
    desc: "Accepted target, not yet emitted. A named logical work defined by a non-empty ordered list of whole-Asset or physical-PDF-page
      selectors. Its domain-separated content_hash excludes titles, URLs, rights and generated text. One Record may compose
      several Assets."
    output: "Stable identity and page map consumed by Ingest generation, review, digestion and public Record routing."
    contains: "Selection and metadata, not a synthetic original."
    copyright: "Record access resolves every selected Asset independently."
  ingest:
    kind: "Data store (private)"
    format: "Markdown (.md) with YAML frontmatter plus verification, review and housekeeping sidecars"
    spec: ingest
    zone: "source"
    desc: "The generated readable representation of a Record. The target Markdown envelope carries authoritative record/3
      frontmatter; deployed files remain legacy record/1 or record/2 while exact body/pre-digest hashes identify revisions."
    output: "The current Ingest, consumed by the digester and Workbench."
    contains: "The full source text of each record, so its copyright follows the source - a mix of public-domain and copyrighted
      material."
    copyright: "Follows the source. This store is kept private because it can hold copyrighted text we are not allowed to
      republish, with proof-of-possession gating in the workbench - a copyright constraint, not secrecy; public-domain material
      here is free to share."
  housekeeping:
    kind: "Component (Python, scheduler worker)"
    zone: "public"
    desc: "Owns startup and at-most-five-minute reconciliation of every live record's exact-byte and deployed-algorithm tuple;
      the ingester's explicit post-commit result is an immediate fast path. The scheduler-owned root algorithm manifest is
      checked against the worker implementation before dispatch. Deterministic checks are local and free; automatic metadata
      research is the highest-priority remote work and is subscription-only. Records with content review already started or
      completed are excluded. It emits proposals only and never applies one."
    output: "One anomalica/housekeeping/3 sidecar per eligible record/version tuple, combining deterministic and subscription-research
      proposals, pass or waiver audit, eventual reviewer decisions and exact result-byte currentness."
    contains: "Rule-based checks, guarded proposal generation and scheduler completion logic - no source corpus."
    copyright: "PUBLIC - open-source code."
  housekeeping_proposals:
    kind: "Data store (private sidecars)"
    zone: "source"
    format: "JSON (anomalica/housekeeping/3)"
    desc: "Human-reviewable deterministic and metadata-research corrections bound to one complete exact ingest input, scheduler-owned
      algorithm manifest and committed Git ref. The authenticated complete decision advances result_sha256 so its own approved
      edits do not retrigger research. Decisions never carry across external tuple changes."
    output: "Pass state, outstanding proposals and decision audit consumed by the Workbench and scheduler."
    contains: "Proposed metadata changes and narrowly guarded source-token corrections, with evidence that may quote the source."
    copyright: "Follows the source and remains beside the private ingest."
  predigest:
    kind: "Data store (private)"
    zone: "source"
    format: "Markdown (.md) - the prepared record"
    desc: "The ingest after the digester's deterministic model-prep: irrelevant regions removed (from the reviewer's marks),
      footnotes inlined at their reference points, word-timestamps stripped. It IS the exact text the model extracts from
      - materialised and stored so the model input is inspectable, not a hidden transform inside the digester. Read-only and
      derived: corrections are made on the ingest and the pre-digest is re-derived. Decision 0042."
    output: "The digester's extraction input; its content hash is recorded in the digest for exact, auditable reproducibility."
    contains: "The prepared source text - still the source's own prose, cleaned - not extracted claims."
    copyright: "Follows the source. It holds source text, so it sits on the SOURCE side of the copyright boundary - gated
      like the ingest. Extraction into public claims is what crosses that boundary; the digests onward are public, the pre-digest
      is not."
  archive:
    kind: "Data store (records/)"
    zone: "source"
    desc: "Durable archive of original Assets by Asset hash plus complete raw AI transcripts. A composite has no synthetic
      original at its Record hash."
    output: "Re-render source for the ingester; provenance of last resort."
    contains: "The original files + raw transcripts. Copyright follows the source."
    copyright: "Follows the source - kept where copyright requires it, the same constraint as the ingests. Backed up off-machine
      to object storage (the bucket node)."
  bucket:
    kind: "Data store (object storage)"
    zone: "source"
    desc: "Off-machine object storage - a cloud storage bucket - holding the source originals so a non-embeddable local file
      can be served to readers and the archive survives loss of the local machine or link-rot at the origin. The originals
      are pushed here from the records/ archive, routed by copyright."
    output: "Originals served to readers; a durable backup of the records/ archive."
    contains: "The original source files - a mix of public-domain and copyrighted material, held in separate zones by status."
    copyright: "Split by status and enforced by the storage zone itself: public-domain and openly-licensed originals sit in
      an open zone (served by a direct URL); copyrighted originals sit in a token-authenticated zone and are only ever handed
      out as short-lived signed URLs after the workbench's proof-of-possession gate passes - there is no public URL for gated
      content."
  workbench:
    kind: "Component (Svelte + FastAPI)"
    zone: "review"
    desc: "The private human review app. Target: a reviewer loads a Record, checks its Ingest against each authorised Asset,
      the original source and the raw archive, corrects the record text, labels who is speaking, adds visual notes (what's
      on screen but not in the audio), marks which records are observed enough to digest, and blocks new content review until
      deterministic housekeeping completes, metadata research completes or is explicitly waived, and every proposal is decided.
      It can preview and atomically commit CAS-bound page/image splits or multi-Asset composition. That structural and per-Asset
      possession contract is not implemented; current writes and gates remain legacy launch blockers. Target clients submit
      only selections and editable metadata; the server derives bodies, maps and hashes."
    output: "Ingest corrections and review sidecars; atomic structural lineage/retirement commits; replayable graph curation.
      Selector preferences are planned with the selector, not current output. It does not ordinarily edit model digests."
    contains: "Reviewer edits + observations; reads the source material to check records against it."
    copyright: "PUBLIC tool. It reads source material that may be copyrighted but never exposes it publicly - what it publishes
      back are the corrections, not the source."
  digester:
    kind: "Component (Python)"
    zone: "public"
    desc: "AI reads each Record and extracts the atomic factual claims and the entities (nodes) they involve, with provenance
      - who said it, where, attestation level, then checks every claim against its own quote with a local classifier (the
      quote check). Defaults to the Claude subscription."
    output: "Currently one canonical digest/1 per Record with scalar location. The accepted migration emits digest/2 exact
      Asset-page anchors only for page-mapped PDF/image record/3; a deferred 1..N comparison path may later emit inert candidates."
    contains: "Structured facts with provenance - no copyrighted text, just claims traceable to a source."
    copyright: "Its output (digests) is public."
  digests:
    kind: "Planned data store (public)"
    format: "YAML (.yaml)"
    spec: digest
    zone: "public"
    desc: "PLANNED, not the current canonical path. Per-model digests of one Record - one digest file per model. A Record
      is digested by several models (1..N), each producing a full set of nodes + claims; the selector picks the single best.
      Kept as the rebuildable inputs the selected digest is chosen from. Inert: never assimilated directly."
    output: "The candidates for the selector."
    contains: "Facts and claims with provenance, per record per model - not source text."
    copyright: "PUBLIC - facts and claims aren't copyrightable."
  selector:
    kind: "Planned component (Python)"
    zone: "public"
    desc: "PLANNED, not currently implemented. A Record is digested by several models (1..N), producing one digest per model.
      The selector picks the single best of those per-model digests to carry forward - it selects a whole digest, it does
      not merge them. Automated, but a reviewer can steer it in the workbench - say which model's digest is better - and that
      preference is replayed, so the result stays rebuildable. Decision 0039."
    output: "One selected digest per Record - the only one assimilated; the per-model digests are kept as the rebuildable
      inputs."
    contains: "The digest-selection + scoring logic. Facts with provenance, no copyrighted text."
    copyright: "Its output (the selected digest) is public."
  selected:
    kind: "Data store (public)"
    format: "YAML (.yaml)"
    spec: digest
    zone: "public"
    desc: "The one canonical digest per Record and source of truth for graph import. Today the digester writes it directly.
      If the planned selector lands, it will instead be the single best candidate chosen from per-model digests."
    output: "The one canonical input to the assimilator, and the claims input to assembler record mode; current ingest review
      and copyright authority separately decides whether and how that public record page is emitted."
    contains: "Facts and claims with provenance, per record - not source text."
    copyright: "PUBLIC - facts and claims aren't copyrightable, so everything from the digests onward is public."
  assimilator:
    kind: "Component (Python)"
    zone: "public"
    desc: "Maintains the current scalar-location graph and resolves entities and semantic agreement. Accepted migration target:
      group anchors overlapping on the same physical Asset page and exact page-text frame into evidence units, and count independence
      only from evidenced distinct work/assertion roots. Asset, Selection, anchor and evidence-unit relations are not implemented;
      unknown lineage fails closed."
    output: "Reads and writes the knowledge graph - maintains it incrementally."
    contains: "The integration logic - import, entity matching, scoring, corroboration, embeddings and search - now its own
      component, split out of the digester. Also shortlists likely duplicate nodes (embedding neighbours, reranked by a local
      model, then judged by a small model) into the workbench merge queue; nothing merges without a person. Shares the digest
      format and the Claude transport with the digester via the anomalica-common library."
    copyright: "Its output (the graph) is public."
  kg:
    kind: "Data artefact"
    format: "SQLite (.db)"
    zone: "public"
    desc: "The unified, queryable knowledge graph: one node per real-world entity, all claims about it from across every source,
      corroboration links and evidence scores. The downloadable, torrentable public dataset and the source for every rendered
      output. Derived - rebuildable from the digests."
    output: "Read by the synthesiser when it chooses which pages to build."
    contains: "Entities, claims, provenance, scores. No copyrighted content."
    copyright: "PUBLIC - the data is meant to outlive the platform."
  synthesiser:
    kind: "Component (Python)"
    zone: "public"
    desc: "Reads the knowledge graph and decides which subjects now have enough corroborated information, across enough independent
      sources, to deserve a page. For each, it gathers exactly the facts that page needs into a 'brief' - a complete, language-neutral
      bundle of claims with their provenance. The choosing is deterministic; no prose is written here."
    output: "One brief per page - the slice of the graph that page is written from."
    contains: "The selection logic and the briefs: facts and claims with provenance, no copyrighted text."
    copyright: "PUBLIC - briefs are facts and claims, not source text."
  briefs:
    kind: "Data store (public)"
    format: "YAML (.yaml)"
    spec: brief
    zone: "public"
    desc: "One language-neutral brief per page: the exact slice of the knowledge graph a page is built from, before any prose.
      Its input hash is what tells the system when a page has gone out of date and needs rebuilding."
    output: "The assembler's only input when it writes an entity article. A public record page comes from one selected digest
      plus current review and copyright authority in the ingests repository, not from a brief."
    contains: "Selected claims with provenance and relationships. No copyrighted text."
    copyright: "PUBLIC."
  assembler:
    kind: "Component (Python)"
    zone: "public"
    desc: "Two target page paths. For an entity article it reads one brief from the synthesiser and writes the prose from
      that alone. Accepted but not implemented: for every live Record maintain a stable hash route with a safe noindex metadata
      shell until complete review plus exact-anchor eligibility, then an indexed explanation. In this contract only page-mapped
      PDF/image Records can gain generated claims; other media remain metadata shells. It projects source content through
      per-Asset copyright allow-lists. It assembles only from sourced claims, never adds facts from training data, and never
      generates imagery. Defaults to the Claude subscription."
    output: "Entity articles from briefs and reviewed record articles from a selected digest plus live ingest authority, both
      to Content."
    contains: "Assembled prose, every sentence traceable to a claim and its source."
    copyright: "Its output is public."
  content:
    kind: "Data store (public)"
    format: "Markdown (.md) with YAML frontmatter"
    zone: "public"
    desc: "The rendered entity articles and reviewed public record pages. Gated record bodies, originals and media never enter
      this public store; eligible source payloads follow separate text, original, media and embed allow-lists."
    output: "Consumed by the site."
    contains: "Assembled articles, safe source metadata, and only source text/media explicitly eligible for public serving."
    copyright: "PUBLIC."
  site:
    kind: "Component (Hugo + Tailwind)"
    zone: "public"
    desc: "The Hugo static site that renders the content to public HTML, in up to 30 displayed languages. Templates and styling
      only - it holds no content itself."
    output: "The public website."
    contains: "Static HTML, the design system."
    copyright: "PUBLIC."
  brand:
    kind: "Shared assets"
    zone: "store"
    desc: "The shared visual identity - triangle logo, deep-teal palette, Outfit + Noto Sans typography, design tokens - consumed
      by the site and the workbench. (These very colours are the brand palette.)"
    output: "Logo, palette, tokens."
    contains: "Design assets."
    copyright: "PUBLIC."
