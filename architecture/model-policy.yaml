schema: anomalica/model-policy/1
updated: '2026-08-28'
watermarking:
  anthropic:
    state: watermarks
    since: '2026-08-02'
    rationale: Anthropic started watermarking its output on 2 August 2026.
  google:
    state: watermarks
    rationale: Google watermarks generated text across the Gemini family.
  openai:
    state: clean
    rationale: No text watermarking as of the date above.
  deepseek:
    state: unknown
    rationale: null
  moonshot:
    state: open_weights
    rationale: Kimi K3's weights are published and can be downloaded and run. A watermark is added at the moment text is generated,
      so a copy we run cannot have one, and a hosted copy can be checked against ours.
  z-ai:
    state: unknown
    rationale: null
  qwen:
    state: unknown
    rationale: null
aliases:
  opus: claude-opus-5
  sonnet: claude-sonnet-5
  haiku: claude-haiku-4-5
status_meanings:
  approved: In use, or ready to use.
  candidate: Worth testing. Not tested yet, and not used until it is.
  unevaluated: Listed so it cannot be picked by accident. No evidence either way.
  blacklisted: Must not be used, for the reason given.
watermarking_meanings:
  watermarks: The provider adds a hidden signal to the text it generates. Not allowed to write anything a reader reads.
  clean: No watermarking, as far as we can tell on the date shown. Allowed to write for readers.
  open_weights: The weights are published, so we generate the text ourselves. A watermark is added when text is generated,
    not stored in the weights, so a model we run cannot carry one. This is stronger than a provider saying it does not watermark,
    because we can check it instead of believing it.
  unknown: Nobody has checked, and the weights are closed, so nobody can. Treated as watermarking.
deny:
  - pattern: google/*
    reason: No Google model is approved for any stage. The family watermarks generated text, and nothing here has been benchmarked
      against an alternative that does not. Listed globally rather than per stage so it cannot be admitted by an omission
      in a new stage.
models:
  - id: claude-opus-5
    provider: anthropic
    context: 1000000
    price:
      input: 15.0
      output: 75.0
    status: approved
    rationale: The strongest model we have access to. Not allowed to write pages, because Anthropic watermarks. It is also
      the most expensive here by some way, so it is chosen for a task that needs it rather than used by default.
  - id: claude-sonnet-5
    provider: anthropic
    context: 1000000
    price:
      input: 2.0
      output: 10.0
    status: approved
    rationale: The everyday model for pulling claims out of records. Its tokeniser changed with the 5 series, so cost figures
      measured on older Sonnet versions do not carry over.
  - id: claude-haiku-4-5
    provider: anthropic
    context: 200000
    price:
      input: 1.0
      output: 5.0
    status: approved
    rationale: 'Used where it is accurate enough, because it is cheaper. Note the smaller 200,000-token window: a job that
      fits on Sonnet may not fit here.'
  - id: openai/gpt-5.6-luna
    provider: openai
    context: 400000
    price:
      input: 0.2
      output: 1.2
    status: approved
    rationale: The cheap model in its family. Fast and accurate at copying text out of documents. It writes noticeably less
      than larger models, which matters on pages where we want every source cited.
  - id: openai/gpt-5.6-sol
    provider: openai
    context: 1050000
    price:
      input: 2.0
      output: 10.0
    status: approved
    rationale: The writing model in the same family as Luna, and third in independent rankings for English prose. The two
      models above it are Claude Opus 5 and Kimi K3.
  - id: moonshotai/kimi-k3
    provider: moonshot
    context: 1048576
    price:
      input: 3.0
      output: 15.0
    status: candidate
    rationale: Second in independent rankings for English prose, behind Claude Opus 5 and ahead of every OpenAI model. Open
      weights, so we can run it ourselves and know there is no watermark.
  - id: deepseek/deepseek-v4-flash
    provider: deepseek
    status: candidate
    rationale: A cheap fast model worth testing. Not tested yet, and its watermarking is unknown, so it cannot write pages
      either way.
  - id: z-ai/glm-5.3-flash
    provider: z-ai
    status: candidate
    rationale: null
  - id: qwen/qwen3.8-flash-next
    provider: qwen
    status: candidate
    rationale: null
stages:
  - id: ingest
    purpose: Extract text faithfully from a source document.
    uses_model: true
    reader_facing: false
    enforced_by: scheduler
    priority:
      - openai/gpt-5.6-luna
    deny: []
    rationale: Audio and video are transcribed by Whisper, which we run ourselves and which calls no provider. This stage
      covers documents only. Copying the text accurately matters more than reasoning about it.
  - id: digest
    purpose: Extract claims and nodes from a reviewed ingest.
    uses_model: true
    reader_facing: false
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: 'The output is structured data, not prose, so watermarking does not apply. This is the stage where accuracy
      matters most: a mistake here ends up on every page built from that claim, and nothing later can catch it.'
  - id: assimilate
    purpose: Match, merge and score entities across digests.
    uses_model: true
    reader_facing: false
    enforced_by: assimilator
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: The same kind of judgement as consolidate, over names rather than records. Getting it wrong splits one person
      into several, or merges two people into one.
  - id: consolidate
    purpose: Merge entities that are the same thing.
    uses_model: true
    reader_facing: false
    enforced_by: assimilator
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: Comparing two entity records and deciding if they describe one thing. Short judgements, so the cheaper model
      is usually enough.
  - id: corroborate
    purpose: Judge whether two similar claims corroborate each other.
    uses_model: true
    reader_facing: false
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: Deciding whether two similar claims support each other. A short yes-or-no judgement, so the cheapest capable
      model is the right one.
  - id: verify
    purpose: Check that assertions in an assembled article trace to graph sources.
    uses_model: true
    reader_facing: false
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
    deny:
      - openai/*
    rationale: Checking that what an article says can be traced back to a source. This must not use the same provider that
      wrote the text, so it is denied OpenAI - the opposite of the writing rule, and together they guarantee two different
      providers.
  - id: variant
    purpose: Run the same extraction across models to compare quality.
    uses_model: true
    reader_facing: false
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
      - openai/gpt-5.6-luna
    deny: []
    rationale: Running the same extraction across several models to compare them. The only stage whose job is to try models
      we have not settled on.
  - id: synthesise
    purpose: Build a brief from graph claims for the writer.
    uses_model: false
    reader_facing: false
    enforced_by: null
    rationale: Code, not a model. Nothing is written here, so there is nothing to watermark and nothing to spend.
  - id: assemble
    purpose: Write a reader-facing article or record page.
    uses_model: true
    reader_facing: true
    enforced_by: scheduler
    priority:
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-luna
    deny: []
    rationale: 'The page a reader reads. Watermarking providers are barred here, which rules out the models we otherwise rate
      highest. Pages already written by a barred model are not being rebuilt: they get rewritten anyway as new claims come
      in.'
    deny_watermarking:
      - watermarks
      - unknown
  - id: translate
    purpose: Render an article into another language.
    uses_model: true
    reader_facing: true
    enforced_by: scheduler
    priority:
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-luna
    deny: []
    rationale: The same text in another language, so the same rule applies. No language is switched on yet.
    deny_watermarking:
      - watermarks
      - unknown
  - id: housekeep
    purpose: Rule-based tidying of an ingested record.
    uses_model: false
    reader_facing: false
    enforced_by: null
    rationale: Code, not a model. Fixed rules only, so it costs nothing and runs on every record.
  - id: housekeep-research
    purpose: Model-assisted cleanup - chapter titles, headings, structure.
    uses_model: true
    reader_facing: false
    enforced_by: scheduler
    priority:
      - claude-haiku-4-5
    deny: []
    rationale: Tidying that needs judgement - chapter titles, headings, structure. Runs across many records on a timer, so
      it uses the cheapest model that copes. Never runs on a record a person has already reviewed.
deny_watermarking_note: 'Reader-facing stages refuse a model by its provider watermarking state, not by a list of provider
  names. The list of banned providers is worked out from the watermarking table above every time, so a provider added there
  is enforced immediately and a state that changes takes effect without anyone editing a stage. A name list would have to
  be updated by hand, and the failure would be silent: a provider nobody added is a provider nobody blocked.'
