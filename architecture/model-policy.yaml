schema: anomalica/model-policy/1
updated: '2026-09-02'
watermarking:
  anthropic:
    state: watermarks
    confidence: high
    open_weights: false
    checked: '2026-09-02'
    evidence: 'Anthropic announced text watermarking on 2026-08-14: "Future Claude models will generate text that contains
      a watermark", and "Claude''s text watermark is a version of the SynthID-Text approach published by Google DeepMind"
      - a sampling-time scheme that "changes the source of randomness used when making some of those choices during text generation",
      so "Nothing is added to the text and there are no hidden characters". The support article states "Claude models launched
      on or after August 2, 2026 support marking at launch" and that "Marking will apply to output from supported models wherever
      Claude is offered, worldwide", covering Claude Platform (API), Claude, Claude Code, Claude Cowork and Claude Tag, plus
      cloud partners (AWS, Google Cloud). The driver is EU AI Act Article 50 transparency; Anthropic says "We will soon be
      offering a watermark detection API. We''re in the process of working out the details of its implementation." Separately,
      C2PA signed provenance metadata is applied to generated image files (.svg/.png/.jpg) - that is metadata, distinct from
      the in-text statistical watermark. Anthropic has never published downloadable weights for any Claude model; all releases
      are hosted-API only (its 2026 open-weights position paper argues against a ban but does not release Claude weights).
      Re-checked 2026-09-02: the support article now states "Models currently supported include Fable 5.1 and Mythos 5.1",
      that marking is in progress for models launched before 2026-08-02, and that "Embedded watermarks will apply to all generated
      text" - so the state is no longer unknown. Anthropic watermarks; the models this project uses (Sonnet 5, Opus 5, Haiku
      4.5) are scheduled to follow.'
    sources:
      - https://www.anthropic.com/news/claude-text-watermark
      - https://support.claude.com/en/articles/16266773-how-claude-marks-ai-generated-content
      - https://techcrunch.com/2026/08/11/anthropic-says-it-will-watermark-text-generated-by-its-ai-models/
      - https://techcrunch.com/2026/08/15/anthropic-shares-more-details-about-how-claudes-new-watermarks-will-work/
    since: '2026-08-02'
    caveat: 'The three models named in the question all launched BEFORE the 2026-08-02 cutoff - Haiku 4.5 (Oct 2025), Sonnet
      5 (2026-06-30), Opus 5 (2026-07-24) - so none of them was marked at launch. They sit in the EU AI Act transition period:
      "we''re working to add watermarking for those models as well... This will be rolled out over the coming months." Anthropic
      has published no model-by-model coverage table and no retrofit date, so as of 2026-08-28 it is NOT established that
      output from Opus 5, Sonnet 5 or Haiku 4.5 carries a watermark today; only that it is intended to. No public detector
      exists yet (detection API still unreleased), so this cannot be verified independently - third-party claims of "tested,
      not watermarked" are unverifiable without the key. Two further scope limits Anthropic states: code carries little or
      no watermark (functional code has too little word-choice freedom), and short passages may not contain enough signal
      to detect. Direction of travel is clear: treat any post-2026-08-02 Claude model as watermarked, and assume the named
      three become watermarked without notice.'
  google:
    state: watermarks
    confidence: high
    open_weights: false
    checked: '2026-08-28'
    evidence: 'Google DeepMind''s own SynthID page states: "We''ve expanded SynthID to watermarking and identifying text generated
      by the Gemini app and web experience," and describes the mechanism as adjusting per-token probability scores during
      generation ("not noticeable to the human eye"), i.e. a statistical sampling-time watermark, not metadata. The peer-reviewed
      Nature paper (23 Oct 2024, "Scalable watermarking for identifying large language model outputs") says outright: "non-distortionary
      SynthID-Text has been productionized and is currently watermarking responses in Gemini and Gemini Advanced," validated
      over roughly 20 million live responses (thumbs-up rate differed by 0.01%). Text watermarking was announced on 14 May
      2024. For the hosted API specifically, a Google staff member on the official Google AI Developers Forum first said on
      2026-08-05 "Generated text from the API is NOT SynthID-watermarked," then posted a correction on 2026-08-19: "After
      checking further with the team, it turns out that text generated via the Gemini API IS actually SynthID-watermarked...
      This also applies to text generated through Google AI Studio and/or antigravity!" Google also open-sourced SynthID-Text
      as a logits processor (Hugging Face Transformers v4.46.0+) for developers to apply to their own models.'
    sources:
      - https://deepmind.google/models/synthid/
      - https://deepmind.google/blog/watermarking-ai-generated-text-and-video-with-synthid/
      - https://www.nature.com/articles/s41586-024-08025-4
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11499265/
    since: '2024-05-14'
    caveat: 'Three real gaps. (1) The API is the weakest link evidentially: the only statement that Gemini API / AI Studio
      output is watermarked is a forum post by a Google employee that reversed his own answer two weeks earlier; no Google
      documentation, model card, or Vertex AI page states it, and the poster''s follow-up question about when API watermarking
      started was left unanswered. Treat the app/web experience as documented fact and the API as staff-asserted but undocumented.
      (2) There is no way to verify independently: the SynthID Detector portal is waitlisted (journalists/researchers) and
      its published modality list is images, video and audio; the Gemini Apps verification help page covers "images, videos,
      and audio" only. Detection needs Google''s secret key. (3) The watermark is fragile by design - it degrades under paraphrase,
      translation and heavy editing, and short outputs carry too little signal. On weights: the Gemini family is closed, API-only,
      so hosted generation is the only path and it carries the watermark. Gemma is Google''s separate open-weights family
      - a self-hosted Gemma emits no watermark unless the operator deliberately enables the open-sourced SynthID-Text logits
      processor. The "since" date is the text-watermarking announcement for the Gemini app; the API start date is unknown.'
  openai:
    state: clean
    confidence: high
    open_weights: false
    checked: '2026-08-28'
    evidence: 'OpenAI''s own API guide "Content provenance" enumerates exactly which signals it applies and to what: "C2PA
      Content Credentials | Images | Signed metadata with issuer and AI-use details" and "SynthID | Images and audio | A watermark
      embedded directly in supported media". Text is absent from that list; no GPT-5.6 model (Sol, Terra, Luna) is mentioned
      as carrying any provenance signal, and the verification API only checks images and audio. OpenAI''s help-centre provenance
      page, updated 2026-08-02 (the day EU AI Act Article 50 transparency obligations began), states forward-looking intent
      rather than deployment: "Consistent with our commitments under the European Commission''s Code of Practice on Transparency
      of AI-generated content, our goal is to expand provenance signals to all modalities including text" - and OpenAI told
      City A.M. it is "currently working through the details", giving no timeline. Reporting through late August 2026 agrees:
      InfoQ''s roundup of Article 50 compliance credits statistical token-sampling text watermarking to Anthropic (Claude
      models released on or after 2 August 2026) and Google (SynthID-Text in Gemini), and describes OpenAI''s measures as
      C2PA metadata plus SynthID on images/audio only. OpenAI built a cryptographic text watermark years ago (WSJ, August
      2024) and deliberately shelved it over paraphrase/translation fragility and disproportionate flagging of non-native
      English writers; that decision has not been reversed.'
    sources:
      - https://developers.openai.com/api/docs/guides/content-provenance
      - https://help.openai.com/en/articles/8912793-provenance-signals-content-credentials-synthid-in-openai-generated-content
      - https://openai.com/index/advancing-content-provenance/
      - https://www.infoq.com/news/2026/08/eu-ai-content-watermark/
    caveat: No OpenAI page says categorically "we do not watermark text" - the conclusion rests on their provenance docs enumerating
      covered modalities and excluding text, plus a goal statement that only makes sense if text is not yet covered. OpenAI
      has signed the EU Code of Practice on Transparency of AI-Generated Content and has publicly committed to extending provenance
      signals to text, so this is a status that could change with little notice; re-check before relying on it long-term.
      Separately, invisible Unicode characters (narrow no-break spaces and similar) are sometimes observed in ChatGPT web
      output - these are chat-interface rendering artefacts, not a watermark, and do not appear in API output. Note also that
      if a text watermark ships it would apply at hosted sampling time only.
  deepseek:
    state: clean
    confidence: high
    open_weights: true
    checked: '2026-08-28'
    evidence: 'DeepSeek publishes V4-Pro and V4-Flash weights openly on Hugging Face under the MIT licence ("This repository
      and the model weights are licensed under the MIT License"), and neither model card mentions watermarking, content labelling,
      or any AI-generated-content identifier. DeepSeek''s Open Platform Terms of Service place the disclosure duty on the
      developer, not on the model: "You shall clearly disclose to your end users that the Output content is generated by AI,
      and may contain errors or omissions" - DeepSeek makes no claim to embed anything in the output itself. DeepSeek''s own
      1 September 2025 compliance announcement under China''s Measures for Labeling of AI-Generated Content and the mandatory
      standard GB 45438-2025 describes exactly two mechanisms: an explicit visible notice ("Content generated by AI, for reference
      only" shown in the interface and appended to generated text) and an implicit identifier written into FILE METADATA (content
      type, service-provider name/code, content number) - both explicitly outside the scope of statistical text watermarking,
      and neither survives copy-paste. No DeepSeek research publication describes a text watermarking scheme and DeepSeek
      publishes no detector; third-party detection of DeepSeek text (Originality.ai, Sapling) is stylometric classification,
      which is what you would expect in the absence of a watermark.'
    sources:
      - https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro
      - https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash
      - https://cdn.deepseek.com/policies/en-US/deepseek-open-platform-terms-of-service.html
      - https://cdn.deepseek.com/policies/en-US/deepseek-terms-of-use.html
    caveat: 'Two limits. First, DeepSeek''s hosted API sampling stack is closed and unaudited, so absence of documentation
      cannot strictly disprove a hidden sampling-time watermark on the API path - the finding rests on DeepSeek discussing
      AI-content marking openly and describing only labels plus metadata. Second, China''s GB 45438-2025 says implicit identifiers
      should include "watermarks where feasible", so a future move is regulatorily plausible; watch for it. None of this affects
      self-hosted use: a statistical text watermark is applied at sampling time by whatever code runs the model, so MIT-licensed
      weights you run yourself cannot carry a DeepSeek watermark under any circumstances.'
  moonshot:
    state: clean
    confidence: medium
    open_weights: true
    checked: '2026-08-28'
    evidence: 'No Moonshot documentation, model card, research paper, or announcement describes a statistical text watermark,
      and they publish no detection tool. The Kimi API docs return nothing on watermark/水印/标识; the Kimi-K2-Thinking and Kimi-K3
      model cards make "no mention of watermarking in generated outputs". The only adjacent clause is regulatory-compliance
      language in the terms of service: platform ToS s3.3(3) forbids "Deleting, altering, or concealing the identification
      marks of artificially generated content that we have labeled, including both explicit and implicit", and the consumer
      agreement says "您不得以任何方式删除、篡改、隐匿 Kimi 智能助手在输出内容中生成的深度合成服务标识" - this tracks China''s 标识办法 / GB 45438-2025, where for
      text the mandated implicit label is file metadata (service-provider name, content number, timestamp, model info) and
      a digital watermark is "recommended... but this is not mandated". Weights are freely downloadable: K2/K2-Instruct/K2-Thinking
      under a Modified MIT Licence on Hugging Face, K3 (published 27 July 2026) under a bespoke Kimi K3 Licence with revenue/attribution
      thresholds but unrestricted download. Separately, the only prominent "watermark + Chinese AI" story is US Treasury''s
      claim that American LLMs'' watermarks were found in Chinese models via distillation - other labs'' marks surviving into
      Chinese models, not Moonshot applying its own.'
    sources:
      - https://platform.kimi.ai/docs/agreement/modeluse
      - https://www.kimi.com/user/agreement/modelUse
      - https://platform.kimi.ai/docs/introduction
      - https://huggingface.co/moonshotai/Kimi-K2-Thinking
    caveat: 'Two gaps. (1) Moonshot has never made a public negative statement ("we do not watermark"), so this is an absence-of-evidence
      conclusion across their docs, ToS, privacy policy, model cards and press coverage, not a denial. (2) The ToS phrase
      "implicit" identification marks is the one genuine ambiguity: read narrowly it is the GB 45438-2025 file-metadata implicit
      label (out of scope here), but the standard also permits content-embedded digital watermarks as an implicit label, and
      Moonshot publishes no technical detail on which they use for text delivered as an API JSON string, where there is no
      file to carry metadata. No third-party analysis of Kimi output for token-distribution bias or zero-width characters
      was found either way. Regardless of the hosted API, open weights mean any self-hosted Kimi deployment carries no Moonshot
      watermark.'
  z-ai:
    state: clean
    confidence: medium
    open_weights: true
    checked: '2026-08-28'
    evidence: 'No Z.ai surface describes a text watermark. The GLM-5 technical report (arXiv 2602.15763), the zai-org/GLM-5
      README, the GLM-5.1 API guide, the GLM-5.2 and GLM-5.3-Flash model cards, and the BigModel platform docs contain no
      watermarking scheme, no announcement, and no detection tool; the only near-match is Z.ai''s Terms of Use, which says
      "you may not remove, modify, or obscure any AI identifiers added to Outputs by Z.ai, regardless of the form in which
      such identifiers are presented" - a legal clause naming no technical method, consistent with China''s labelling regime
      rather than a sampling-time watermark. That regime pushes away from text watermarking: GB 45438-2025 and the CAC Labelling
      Measures (in force 2025-09-01) require for TEXT an explicit visible label ("AI"/"生成") plus an implicit identifier in
      FILE METADATA, while content-embedded digital watermarks are encouraged for audio/image/video and are not mandated for
      text. Third-party surveys of who watermarks text as of August 2026 name only Anthropic (SynthID-Text-derived, every
      Claude model from 2026-08-02) and Google (SynthID); Z.ai/Zhipu/GLM appear in none of them, and Z.ai is not among the
      EU Transparency Code of Practice signatories. Structurally it could not bind anyway: GLM-5.1, GLM-5.2 and GLM-5.3-Flash
      (320B-A18B, released 2026-08-26) are MIT-licensed open weights on Hugging Face under zai-org, so self-hosted inference
      carries no provider-side sampling watermark; only the flagship GLM-5.3 weights were still held back pending safety evaluation
      as of late August 2026.'
    sources:
      - https://docs.z.ai/legal-agreement/terms-of-use
      - https://docs.z.ai/guides/llm/glm-5.1
      - https://docs.bigmodel.cn/cn/guide/start/introduction
      - https://arxiv.org/abs/2602.15763
    caveat: Z.ai has never made an explicit public statement either way - there is no "we do not watermark" denial to point
      at, so this is an absence-of-evidence finding across their docs, papers, repo and model cards rather than a positive
      disclaimer. The Terms of Use "AI identifiers ... regardless of the form in which such identifiers are presented" clause
      is deliberately broad and would legally cover a hidden signal if they ever added one; it is the single piece of text
      that cannot be fully ruled out, though it names no method and matches the Chinese visible-label-plus-metadata scheme.
      No independent statistical test of GLM API output for a green-list/Gumbel-style watermark has been published, so the
      hosted API path is unverified empirically. SaferAI's external GLM-5.2 evaluation notes Z.ai published no safety framework,
      pre-deployment testing commitments or risk assessment at all, so silence on watermarking sits inside a broader silence
      on published safety posture - it is weaker evidence than silence from a lab that documents provenance work in detail.
      Behaviour could also differ between the international z.ai endpoint and the mainland open.bigmodel.cn endpoint, which
      faces the CAC rules directly; nothing found distinguishes the two. Open weights make the question moot for any locally
      run GLM regardless of what the API does.
  qwen:
    state: clean
    confidence: medium
    open_weights: true
    checked: '2026-08-28'
    evidence: 'No Alibaba/Qwen documentation, model card, technical report or announcement describes a statistical text watermark.
      Stanford''s Foundation Model Transparency Index company report for Alibaba/Qwen3 (Dec 2025) records no disclosure at
      all on watermarking or provenance for text outputs. Positive counter-evidence: Alibaba''s own way of spotting AI text
      is a CLASSIFIER, not a key-based watermark detector - the AI Guardrails / content-moderation docs describe "AI生成文本鉴别"
      via the `text_aigc_detector` service, which flags text that "疑似由AI生成合成" (appears to be AI-generated); a provider that
      watermarked its own text would verify the key instead of guessing. Alibaba does watermark other modalities, which sharpens
      the contrast: the Qwen-Image API exposes a `watermark` parameter, and the SASE `CreateWmEmbedTask` API embeds and extracts
      digital watermarks for images, audio, video and document files - none of it token-level watermarking of chat/completion
      text. The Chinese labelling regime Qwen complies with (Measures + mandatory standard GB 45438-2025, in force 1 Sept
      2025) requires a visible label plus an implicit label in FILE METADATA; a digital watermark inside the content itself
      is explicitly encouraged but not mandated, so the widely-reported "Doubao, DeepSeek, Qwen and Ernie labelled 150 billion
      pieces of content" figure is metadata and visible labels, which the question excludes. Open weights: Qwen3 models are
      Apache 2.0 and freely downloadable on Hugging Face (e.g. Qwen/Qwen3-235B-A22B, ~406k downloads in the last month), so
      any self-hosted Qwen carries no provider-side watermark regardless of what the hosted API does.'
    sources:
      - https://crfm.stanford.edu/fmti/December-2025/company-reports/Alibaba_FinalReport_FMTI2025.html
      - https://help.aliyun.com/zh/document_detail/2979119.html
      - https://help.aliyun.com/zh/sase/getting-started/aigc-logo-addition-guide
      - https://www.alibabacloud.com/help/en/model-studio/qwen-image-api
    caveat: 'No published third-party statistical probe of Qwen''s hosted API for a watermark. The ETH SRI black-box watermark-detection
      work (arXiv 2405.20777, ICLR 2025) tested GPT-4, Claude 3 and Gemini 1.0 Pro - finding no strong evidence of a watermark
      - but did not cover Qwen, and I found no later study that did. So "clean" rests on (a) absence across Alibaba''s own
      docs, research output and transparency reporting, (b) their AI-text detection being classifier-based, and (c) the Chinese
      standard not requiring in-content text watermarks - not on a direct measurement of the API. Two things not established
      either way: whether Alibaba adds any hidden marker to Tongyi/Qwen Chat consumer output (a metadata/ID scheme would satisfy
      the law and is out of scope here anyway), and whether some future Qwen serving path adds one. Also note the flagship
      top-end model (Qwen3.x-Max) is served API-only under a bespoke licence rather than Apache 2.0, so "open weights" holds
      for the downloadable Qwen3 line, not literally every Qwen model.'
  moritzlaurer:
    state: clean
    confidence: high
    open_weights: true
    checked: '2026-09-02'
    evidence: 'Open-weight classifier checkpoints (MIT licence) published on Hugging Face by an individual researcher and
      run on our own hardware. A classifier emits a label and a probability, not text, so there is no generated text to watermark;
      and open weights run locally cannot carry a provider-side sampling watermark in any case.'
    sources:
      - https://huggingface.co/MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
aliases:
  opus: claude-opus-5
  sonnet: claude-sonnet-5
  haiku: claude-haiku-4-5
watermarking_meanings:
  watermarks: The provider puts a hidden signal in the text it generates, so it can later be identified as machine-written.
  clean: We looked and found no text watermarking on the date shown. What we checked is recorded against each provider.
  unknown: We could not establish it either way. Treated the same as watermarking.
deny:
  - pattern: google/*
    reason: Refused everywhere, not only for writing. The watermarking table records the evidence and the date it was checked.
models:
  - id: claude-opus-5
    tier: flagship
    provider: anthropic
    context: 1000000
    price:
      input: 5.0
      output: 25.0
    rationale: The strongest model we have access to, at $5/$25 per million tokens - two and a half times Sonnet on input,
      not the outlier it was once priced at. Not used for anything at present. It cannot write articles because we cannot
      establish whether Anthropic watermarks its output.
    used_for:
      - digest
      - verify
    tested: true
  - id: claude-sonnet-5
    tier: middle
    provider: anthropic
    context: 1000000
    price:
      input: 2.0
      output: 10.0
    rationale: Pulls claims out of source documents, and wrote most of the articles here before the watermarking rule barred
      it from writing. Its tokeniser changed with the 5 series, so older cost measurements do not carry over.
    used_for:
      - digest
      - assimilate
      - consolidate
      - corroborate
      - verify
      - variant
    tested: true
  - id: claude-haiku-4-5
    tier: light
    provider: anthropic
    context: 200000
    price:
      input: 1.0
      output: 5.0
    rationale: Used where it is accurate enough, because it is cheaper. Its 200,000-token window is the smallest here, so
      a job that fits on Sonnet may not fit on it.
    used_for:
      - digest
      - assimilate
      - consolidate
      - corroborate
      - variant
      - housekeep-research
    tested: true
  - id: openai/gpt-5.6-luna
    tier: light
    provider: openai
    context: 1050000
    price:
      input: 0.2
      output: 1.2
    rationale: The fast, cheap end of its family. OpenAI points it at repetitive work with clear rules - extracting fields,
      tagging and classifying records - which is what our extraction stage does. It writes less than larger models when nothing
      tells it how long to be.
    used_for:
      - ingest
      - variant
      - assemble
      - translate
    tested: true
  - id: openai/gpt-5.6-sol
    tier: flagship
    provider: openai
    context: 1050000
    price:
      input: 2.0
      output: 10.0
    rationale: The flagship of its family - the one OpenAI points at the hardest work. Its listed $2/$10 is promotional through
      at least 21 November 2026; standard is $4/$20, so this price will roughly double.
    used_for:
      - assemble
      - translate
    tested: true
    price_note: promotional to 2026-11-21; standard 4.0/20.0
  - id: openai/gpt-5.6-terra
    tier: middle
    provider: openai
    context: 1050000
    price:
      input: 2.0
      output: 12.0
    rationale: The balanced middle of its family, the closest match to Sonnet in role. Untested here.
    used_for:
      - assemble
      - translate
    tested: true
  - id: moonshotai/kimi-k3
    tier: flagship
    provider: moonshot
    context: 1048576
    price:
      input: 3.0
      output: 15.0
    rationale: Second in independent rankings for English prose, ahead of every OpenAI model. Its weights are published, so
      it can be run without going through a provider at all.
    used_for: []
    tested: false
  - id: deepseek/deepseek-v4-flash
    tier: light
    provider: deepseek
    rationale: A cheap fast model with published weights. Not tested here yet.
    price:
      input: 0.0809
      output: 0.1618
    used_for: []
    tested: false
    context: 1048576
  - id: z-ai/glm-5.3-flash
    tier: light
    provider: z-ai
    rationale: null
    price:
      input: 0.075
      output: 0.25
    used_for: []
    tested: false
    context: 1310720
  - id: qwen/qwen3.8-flash
    tier: light
    provider: qwen
    rationale: null
    price:
      input: 0.15
      output: 0.47
    used_for: []
    tested: false
    context: 1000000
  - id: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
    tier: light
    provider: moritzlaurer
    context: 512
    price:
      input: 0.0
      output: 0.0
    rationale: A 184-million-parameter natural-language-inference classifier run on our own machine. It writes nothing; it
      labels a premise and a hypothesis as entails, neutral or contradicts. Stage one of the per-claim entailment check, the
      quote against the claim. Validated on 50 hand-labelled claims and 12 planted contradictions (2026-09-02).
    used_for:
      - check
    tested: true
  - id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
    tier: middle
    provider: moritzlaurer
    context: 512
    price:
      input: 0.0
      output: 0.0
    rationale: The larger sibling, used only for stage two of the entailment check, where a claim the quote alone leaves neutral
      is re-checked against the record text around the quote.
    used_for:
      - check
    tested: true
  - id: Qwen/Qwen3-Reranker-0.6B
    tier: light
    provider: qwen
    context: 32000
    price:
      input: 0.0
      output: 0.0
    rationale: >-
      Trial 2026-09-02 (assimilator/reports/reranker-eval-2026-09-02.md). Ranks the merge queue; never decides. Against 178
      human-merged pairs and 337 constructed negatives (the ledger holds one human rejection), AUC 0.867 with claims and 0.980
      names only, against the rules' 0.716; same-type pairs 0.867 against 0.546. At a cut of 0.9 with claims, precision 0.67
      and recall 0.63; names only 0.91 and 0.96. Finds 80 of the 100 human-merged pairs the rules never surface, given a shortlist;
      fails on relatives and co-witnesses (48 of 269 same-surname pairs scored as one person). On the live queue it moves
      the fuzzy rule's false positives (Austria and Australia at 0.88) to the bottom. GPU run of 1.5 minutes for 327 pairs
      at about 2.7 GB of device memory; CPU works at 12 seconds per pair. Shipped behind a flag, default off.
    used_for:
      - rerank
    tested: true
stages:
  - id: ingest
    purpose: Extract text faithfully from a source document.
    uses_model: true
    reader_facing: true
    enforced_by: scheduler
    priority:
      - openai/gpt-5.6-luna
    deny: []
    rationale: Audio and video are transcribed by Whisper, which we run ourselves and which calls no provider. This stage
      covers documents only. Copying the text accurately matters more than reasoning about it.
    output: reproduction
    output_note: The model transcribes a document rather than composing. Its output is the source's words, gated behind proof
      of possession, and a watermark on a reproduction marks our copy of someone else's text rather than an assertion of ours.
    deny_watermarking:
      - watermarks
      - unknown
  - id: digest
    purpose: Extract claims and nodes from a reviewed ingest.
    uses_model: true
    enforced_by: scheduler
    priority:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: 'Pulling claims out of a record. Which model depends on the document, not on preference: long many-chunk sources
      (long interviews, dense PDFs, books) go to Opus, which is about 2.5x faster and holds recall across chunks better; short
      single-chunk sources go to Haiku, whose recall holds and which is lighter on shared capacity. Sonnet is the middle.
      Accuracy matters more here than anywhere else: a mistake ends up on every page built from that claim and nothing later
      can catch it.'
    output: published_prose
    output_note: The claim text is a sentence the model writes in our words - "David Fravor was a United States Navy pilot
      for 18 years" is ours, not the source's - and it appears on every page built from that claim. Decision 2026-09-02 (Mark)
      - extraction stays on Claude via the subscription. The watermark bar applies to reader-facing and reproduction stages
      (assemble, translate, ingest), not to a one-sentence claim whose verbatim quote sits beside it.
  - id: assimilate
    purpose: Match, merge and score entities across digests.
    uses_model: true
    enforced_by: assimilator
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: The same kind of judgement as consolidate, over names rather than records. Getting it wrong splits one person
      into several, or merges two people into one.
    output: published_label
    output_note: Mostly a same-or-different decision, which is never published. But the surviving canonical name becomes a
      page title, so a small amount of model wording does reach readers. Treated as published prose because a page title is
      quoted and indexed like any other text.
  - id: consolidate
    purpose: Merge entities that are the same thing.
    uses_model: true
    enforced_by: assimilator
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: Comparing two entity records and deciding if they describe one thing. Short judgements, so the cheaper model
      is usually enough.
    output: published_label
    output_note: 'As assimilate: the decision is internal, the surviving name is public. Treated as published prose because
      a page title is quoted and indexed like any other text.'
  - id: corroborate
    purpose: Judge whether two similar claims corroborate each other.
    uses_model: true
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
    deny: []
    rationale: Deciding whether two similar claims support each other. A short yes-or-no judgement, so the cheapest capable
      model is the right one.
    output: internal
    output_note: A yes-or-no verdict over two claims. Never published in any form.
  - id: verify
    purpose: Check that assertions in an assembled article trace to graph sources.
    uses_model: true
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
      - claude-opus-5
    deny:
      - openai/*
    rationale: Checking that an article traces back to its sources. Must not be the provider that wrote the article, so it
      refuses OpenAI while writing is OpenAI. Nothing it writes is published, so a watermarking provider is fine here - and
      Claude is the strongest option available for the job.
    output: internal
    output_note: A verdict on whether an article traces to its sources, plus reasoning nobody publishes. The output is a check,
      not text.
  - id: variant
    purpose: Run the same extraction across models to compare quality.
    uses_model: true
    enforced_by: scheduler
    priority:
      - claude-sonnet-5
      - claude-haiku-4-5
      - openai/gpt-5.6-luna
    deny: []
    rationale: Running the same extraction across several models to compare them. The only stage whose job is to try models
      we have not settled on.
    output: internal
    output_note: Comparison digests, used to judge models against each other. Never published.
  - id: synthesise
    purpose: Build a brief from graph claims for the writer.
    uses_model: false
    enforced_by: null
    rationale: Code, not a model. Nothing is written here, so there is nothing to watermark and nothing to spend.
    output: internal
    output_note: Code, not a model.
  - id: assemble
    purpose: Write a reader-facing article or record page.
    uses_model: true
    reader_facing: true
    enforced_by: scheduler
    priority:
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-terra
      - openai/gpt-5.6-luna
    deny: []
    rationale: 'The page a reader reads. Which models may write it is decided by the watermarking table, not by a list kept
      here. Pages already written by a model that is now barred are not being rebuilt: they get rewritten anyway as new claims
      come in.'
    output: published_prose
    output_note: The article a reader reads.
    deny_watermarking:
      - watermarks
      - unknown
  - id: translate
    purpose: Render an article into another language.
    uses_model: true
    reader_facing: true
    enforced_by: scheduler
    priority:
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-terra
      - openai/gpt-5.6-luna
    deny: []
    rationale: The same text in another language, so the same rule applies. No language is switched on yet.
    output: published_prose
    output_note: The same article in another language.
    deny_watermarking:
      - watermarks
      - unknown
  - id: housekeep
    purpose: Rule-based tidying of an ingested record.
    uses_model: false
    enforced_by: null
    rationale: Code, not a model. Fixed rules only, so it costs nothing and runs on every record.
    output: internal
    output_note: Code, not a model.
  - id: housekeep-research
    purpose: Model-assisted cleanup - chapter titles, headings, structure.
    uses_model: true
    enforced_by: scheduler
    priority:
      - claude-haiku-4-5
    deny: []
    rationale: Tidying that needs judgement - chapter titles, headings, structure. Runs across many records on a timer, so
      it uses the cheapest model that copes. Never runs on a record a person has already reviewed.
    output: published_label
    output_note: Chapter titles and headings, which are shown on record pages. Treated as published prose because a page title
      is quoted and indexed like any other text.
  - id: check
    purpose: Test whether each claim is warranted by its quote, or by the record around it.
    uses_model: true
    enforced_by: digester
    priority:
      - MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
      - MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
    deny: []
    rationale: A classifier, not a writer. It emits one of three labels and a probability per claim, on our own machine at
      no cost, as the last step of digest and as a backfill over existing digests. The verdict is stored in the digest and
      shown to reviewers; it never removes or rewords a claim. Measured 2026-09-02 on our own claims, the quote alone warrants
      about a quarter of good claims; the surrounding record warrants most of the rest.
    output: internal
    output_note: A label per claim, never prose.
  - id: rerank
    purpose: Rank candidate node merges for human review.
    uses_model: true
    enforced_by: assimilator
    priority:
      - Qwen/Qwen3-Reranker-0.6B
    deny: []
    rationale: Scores each pair of candidate nodes on whether they name the same entity, so the review queue shows real duplicates
      first. Nothing merges without a human, and the model writes nothing.
    output: internal
    output_note: A score per candidate pair, never prose.
deny_watermarking_note: 'Reader-facing stages refuse a model by its provider watermarking state, not by a list of provider
  names. The list of banned providers is worked out from the watermarking table above every time, so a provider added there
  is enforced immediately and a state that changes takes effect without anyone editing a stage. A name list would have to
  be updated by hand, and the failure would be silent: a provider nobody added is a provider nobody blocked.'
watermarking_checked: '2026-08-28'
prices_checked: '2026-09-01'
model_fields_note: '`used_for` lists the stages that may pick this model, derived from the stage priority lists rather than
  asserted separately. A model with an empty list is not used - which is a fact about our pipeline, not a judgement about
  the model. There is deliberately no global approved/candidate status: a model is right for a job or it is not, and a single
  word cannot say that. A status field would also be a second answer to a question the stages already answer, free to drift
  from them.'
tiers_note: 'Each family has the same three tiers and they map across: Sol/Opus for the hardest work, Terra/Sonnet for ordinary
  production, Luna/Haiku for high-volume rule-following work. Choosing a tier is a separate question from choosing a provider,
  and a stage that needs the top tier from a non-watermarking provider wants Sol, not Luna.'
output_kinds:
  internal: The model emits a decision, a verdict or a comparison that is never published. Watermarking cannot reach a reader,
    so it is not a consideration and every provider is eligible.
  reproduction: The model reproduces someone else's words rather than composing its own. Gated separately by copyright; watermarking
    is not the control that matters.
  published_label: A short piece of model wording - a page title, a heading - that readers see. Treated as published prose.
  published_prose: Sentences the model composed, published for readers. Watermarking providers are refused here.
output_kinds_note: The question is not whether a stage is 'reader-facing' but whether THE MODEL'S OWN WORDS GET PUBLISHED.
  A verifier reads published text and returns a verdict; nothing it writes reaches anyone, so a watermark in it is inert and
  barring a provider there costs quality for no benefit. This distinction was previously collapsed into one boolean, which
  barred watermarking providers from checking work they were already allowed to read.
context_selection_note: 'Every model carries `context`, its input limit in tokens. A stage that assembles a large input must
  pick a model whose window fits it, measured from the actual input rather than assumed: an article brief ranges from 12 claims
  to 2,600, so one model cannot be right for the whole range. Where the input is small the smaller and cheaper model is correct;
  where it is large the choice is constrained before quality is considered. A brief truncated to fit a window silently loses
  evidence - claims cut from a brief cannot be cited, and nothing downstream can tell they existed. Fit first, then quality,
  then cost.'
